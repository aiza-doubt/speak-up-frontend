function reportHtml(session, phase, error, retryAct) {
  if (phase === "saving" || phase === "analyzing") return `<div class="card stack" aria-busy="true"><h2 class="row">${ic("spark")} ${esc(t("report.title"))}</h2><div class="row"><span class="spinner"></span><strong>${esc(phase === "saving" ? t("rec.saving") : t("report.processing"))}</strong></div><div class="progress-bar"><span style="width:${phase === "saving" ? 25 : 65}%"></span></div><p class="small muted">${esc(t("report.processingSteps"))}</p></div>`;
  if (phase === "failed") return `<div class="card stack"><h2>${esc(t("report.title"))}</h2><div class="alert alert-danger" role="alert">${ic("alert")}<div><p><strong>${esc(t("report.failed"))}</strong> ${esc(errText(error))}</p>${retryAct ? `<div class="alert-actions"><button class="btn btn-secondary btn-sm" data-act="${retryAct}">${esc(t("common.retry"))}</button></div>` : ""}</div></div>${session && session.metrics ? fluencyHtml(session.metrics) : ""}</div>`;
  if (!session || !session.report) return "";
  const r = session.report;
  if (r.insufficient) return `<div class="card stack"><h2>${esc(t("report.title"))}</h2><div class="alert alert-accent">${ic("info")}<span>${esc(t("report.insufficient", { n: r.wordCount || 0 }))}</span></div>${session.metrics ? fluencyHtml(session.metrics) : ""}</div>`;
  const ai = r.ai;
  const sec = (icon, title, body) => `<section class="report-section"><h3><span class="icon-chip sm">${ic(icon)}</span>${esc(title)}</h3>${body}</section>`;
  const list = (a) => `<ul class="bullets">${a.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="card report">
    <div class="row-between"><h2 class="row">${ic("spark")} ${esc(t("report.title"))}</h2>${r.edited ? `<span class="badge">${esc(t("report.basedOnEdited"))}</span>` : ""}</div>
    ${ai.summary ? `<p style="color:var(--text-2)">${esc(ai.summary)}</p>` : ""}
    ${ai.cefr_estimate || ai.ielts_band_estimate != null ? `<div class="estimate"><span class="icon-chip">${ic("award")}</span>${ai.cefr_estimate ? `<div><div class="small muted">${esc(t("report.cefrEstimate"))}</div><div class="big">${esc(ai.cefr_estimate)}</div></div>` : ""}${ai.ielts_band_estimate != null ? `<div><div class="small muted">${esc(t("report.ieltsEstimate"))}</div><div class="big">${Number(ai.ielts_band_estimate).toFixed(1)}</div></div>` : ""}<div style="flex:1 1 240px" class="small"><strong>${esc(t("report.estimate"))}</strong>${ai.estimate_rationale ? `<p>${esc(ai.estimate_rationale)}</p>` : ""}<p class="muted">${esc(t("report.notOfficial"))}</p></div></div>` : ""}
    ${session.kind !== "conversation" && (session.edited || session.transcript) ? sec("clip", t("report.fullTranscript"), `<div class="text-block" lang="en">${esc(session.edited || session.transcript)}</div>`) : ""}
    ${ai.corrected_version ? sec("check", t("report.correctedVersion"), `<div class="text-block corrected" lang="en">${esc(ai.corrected_version)}</div>`) : ""}
    ${sec("list", t("report.grammar"), ai.grammar.length ? `<div class="stack-sm">${ai.grammar.map((g) => `<div class="correction"><div class="pair" lang="en"><span class="from">${esc(g.original)}</span>${ic("arrow")}<span class="to">${esc(g.corrected)}</span>${g.at != null ? `<span class="badge">${esc(t("report.atTime", { t: fmt(g.at) }))}</span>` : ""}</div><p class="why">${esc(g.explanation)}</p></div>`).join("")}</div>` : `<p class="muted">${esc(t("report.noGrammar"))}</p>`)}
    ${sec("book", t("report.vocabulary"), ai.vocabulary.length ? `<div class="stack-sm">${ai.vocabulary.map((v) => `<div class="correction"><div class="row-between"><div class="pair" lang="en">${v.original ? `<span style="color:var(--text-2)">${esc(v.original)}</span>${ic("arrow")}` : ""}<span class="to">${esc(v.suggestion)}</span></div>${saveBtn(v.suggestion, "feedback", v.example)}</div><p class="why">${esc(v.explanation)}</p>${v.example ? `<p class="small muted" lang="en">“${esc(v.example)}”</p>` : ""}</div>`).join("")}</div>` : `<p class="muted">${esc(t("report.noneFound"))}</p>`)}
    ${sec("wave", t("report.pronunciation"), `<div class="alert">${ic("info")}<div><strong>${esc(t("report.pronUnavailable"))}</strong><p class="small">${esc(t("report.pronUnavailableBody"))}</p></div></div>`)}
    ${session.metrics ? fluencyHtml(session.metrics, ai.contextual_fillers) : ""}
    <div class="grid-2">${sec("check", t("report.strengths"), list(ai.strengths))}${sec("trend", t("report.improvements"), list(ai.improvements))}</div>
    ${sec("spark", t("report.recommendations"), `<ol class="bullets">${ai.recommendations.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>`)}
  </div>`;
}
function fluencyHtml(m, fillers) {
  const tile = (k, v, n) => `<div class="metric-tile"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span><span class="n">${esc(n)}</span></div>`;
  const hes = Object.entries((m.hesitations || []).reduce((a, h) => ((a[h.word] = (a[h.word] || 0) + 1), a), {})).map(([w, n]) => `${w} ×${n}`).join(", ");
  return `<section class="report-section"><h3><span class="icon-chip sm">${ic("trend")}</span>${esc(t("report.fluency"))}</h3>
    <div class="metrics-grid">${tile(t("report.duration"), fmt(m.durationSec), t("report.durationNote"))}${tile(t("report.voiced"), t("report.notMeasured"), t("report.voicedNote"))}${tile(t("report.pace"), m.wpm != null ? t("live.wpm", { n: m.wpm }) : t("report.paceNeedMore"), t("report.paceNote"))}${tile(t("report.longPauses"), String((m.longPauses || []).length), t("web.pauseApprox"))}</div>
    ${(m.longPauses || []).length ? `<div class="vocab-chips">${m.longPauses.slice(0, 12).map((p) => `<span class="chip" style="padding-right:11px">${esc(t("report.pauseItem", { len: p.length.toFixed(1), at: fmt(p.at) }))}</span>`).join("")}</div>` : ""}
    <h4 style="font-size:.95rem;margin-top:4px">${esc(t("report.repeats"))}</h4>
    <div class="grid-3" style="gap:12px"><div class="metric-tile"><span class="k">${esc(t("report.repeatedWords"))}</span><span class="small ${m.repeats.length ? "" : "muted"}" lang="en">${m.repeats.length ? esc(m.repeats.slice(0, 6).map((r) => "“" + r.phrase + "”").join(", ")) : esc(t("report.noneFound"))}</span></div>
    <div class="metric-tile"><span class="k">${esc(t("report.hesitations"))}</span><span class="small ${hes ? "" : "muted"}" lang="en">${esc(hes || t("report.noneFound"))}</span></div>
    <div class="metric-tile"><span class="k">${esc(t("report.contextFillers"))}</span><span class="small ${fillers && fillers.length ? "" : "muted"}">${fillers && fillers.length ? fillers.slice(0, 5).map((f) => `<span style="display:block"><span lang="en">“${esc(f.phrase)}”</span> — ${esc(f.explanation)}</span>`).join("") : esc(t("report.noneFound"))}</span></div></div>
  </section>`;
}
function saveBtn(term, source, example) {
  const saved = S.vocab.some((v) => v.term.toLowerCase() === String(term).toLowerCase());
  return `<button type="button" class="btn btn-sm btn-icon ${saved ? "btn-ghost" : "btn-soft"}" data-save="${esc(term)}" data-source="${source}" data-example="${esc(example || "")}" ${saved ? "disabled" : ""} aria-label="${esc(t("topics.save"))}: ${esc(term)}" title="${esc(t("topics.save"))}">${ic(saved ? "check" : "save")}</button>`;
}

// ---------- recorder page ----------
function pRecorder() {
  if (!S.rec) S.rec = { topicId: null, phase: "idle", sessionId: null };
  const r = S.rec, topic = topicById(r.topicId);
  const locked = Speech.owner === "recorder" && Speech.state !== "idle";
  const session = r.sessionId ? S.sessions.find((x) => x.id === r.sessionId) : null;
  const limit = topic && topic.ielts ? topic.ielts.speakSec : null;
  const needPrep = topic && topic.ielts && topic.ielts.prepSec > 0 && !locked && r.prepLeft !== 0;
  return `<div><div class="page-head"><div><h1>${esc(t("rec.title"))}</h1><p>${esc(t("rec.sub"))}</p></div>
    <div class="field" style="min-width:240px"><label for="rec-topic">${esc(t("rec.topic"))}</label><select id="rec-topic" class="select" ${locked ? "disabled" : ""}><option value="">${esc(t("rec.noTopic"))}</option>${TOPICS.map((x) => `<option value="${x.id}" ${x.id === r.topicId ? "selected" : ""}>${esc(x.title[S.lang])} (${x.levels[0]}–${x.levels[1]})</option>`).join("")}</select></div></div>
    <div class="practice-grid"><div class="card recorder-card">${needPrep ? prepCard(topic.ielts.prepSec, topic.ielts.speakSec, "recorder") : recorderCard("recorder", { limit })}</div>
    <div class="side-panel">${promptCard(topic)}${locked ? liveFeedbackCard() : ""}</div></div>
    ${Speech.owner === "recorder" && Speech.state === "stopped" ? `<section style="margin-top:24px" aria-label="${esc(t("rec.finalReport"))}">${reportHtml(session, r.phase, r.error, "rec-retry")}</section>` : ""}
  </div>`;
}
function promptCard(topic) {
  if (!topic) return `<div class="card card-tight stack-sm"><h3>${esc(t("rec.prompt"))}</h3><p class="small muted">${esc(t("rec.promptFree"))}</p></div>`;
  const ie = topic.ielts;
  return `<div class="card card-tight stack-sm"><h3>${esc(ie && ie.cueCard ? t("ielts.cueCard") : t("rec.prompt"))}</h3><strong>${esc(topic.title[S.lang])}</strong>
    ${ie && ie.cueCard ? `<p lang="en" style="white-space:pre-line">${esc(ie.cueCard)}</p>` : ie && ie.questions ? `<ol class="bullets" lang="en">${ie.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ol>` : `<p class="small muted">${esc(t("rec.promptTopic"))}</p>`}
    <span class="label" style="margin-top:6px">${esc(t("topics.vocab"))}</span>
    <div class="stack-sm">${topic.vocabulary.map((v) => `<div class="row-between" style="flex-wrap:nowrap"><span lang="en"><strong>${esc(v.term)}</strong><br><span class="small muted">${esc(v.example)}</span></span><span class="row" style="flex-wrap:nowrap;gap:4px">${speakBtn("tv-" + v.term, v.term)}${saveBtn(v.term, "topic", v.example)}</span></div>`).join("")}</div></div>`;
}
let prepTimer = null;
function prepCard(prepSec, speakSec, owner) {
  const st = owner === "recorder" ? S.rec : S.assess;
  return `<div class="stack"><div class="rec-head"><h2 style="font-size:1.15rem">${esc(t("ielts.prep"))}</h2><span class="badge badge-accent">${fmt(prepSec)}</span></div>
    <div class="rec-panel"><div class="rec-timer" role="timer" data-prep>${fmt(st.prepLeft ?? prepSec)}</div><p class="muted small" style="text-align:center">${esc(t("ielts.prepRunning"))}</p>
    <div class="rec-controls">${st.prepLeft == null ? `<button class="btn btn-secondary" data-act="prep-start" data-owner="${owner}" data-sec="${prepSec}">${ic("hour")} ${esc(t("ielts.startPrep"))}</button>` : ""}
    ${S.caps.dictation ? `<button class="btn btn-primary" data-act="rec-start" data-owner="${owner}">${ic("mic")} ${esc(t("ielts.skipPrep"))}</button>` : `<button class="btn btn-primary" data-act="prep-skip" data-owner="${owner}">${esc(t("web.typeInstead"))}</button>`}</div>
    ${st.prepLeft != null ? `<textarea class="textarea" id="prep-notes" placeholder="${esc(t("ielts.notesPh"))}" style="min-height:90px"></textarea>` : ""}</div>
    <p class="small muted">${esc(t("ielts.speaking"))}: ${fmt(speakSec)}</p></div>`;
}

// ---------- assessment ----------
function pAssessment() {
  const a = S.assess, task = taskById(a.taskId);
  const hist = S.sessions.filter((s) => s.kind === "assessment");
  const locked = Speech.owner === "assessment" && Speech.state !== "idle";
  const card = (x) => `<article class="card topic-card"><div class="row-between"><span class="icon-chip">${ic("clip")}</span><span class="badge badge-accent">${x.levels[0]}${x.levels.length > 1 ? "–" + x.levels[x.levels.length - 1] : ""}</span></div><h3>${esc(x.title[S.lang])}</h3><p class="desc" lang="en">${esc(x.prompt.split("\n")[0])}</p><div class="row small muted">${x.prepSec ? `<span>${esc(t("assess.prepSec", { n: x.prepSec }))}</span>` : ""}<span>${esc(t("assess.speakSec", { n: x.speakSec / 60 }))}</span></div><div class="actions"><button class="btn btn-primary btn-sm" data-task="${x.id}">${esc(t("assess.begin"))}</button></div></article>`;
  const session = a.sessionId ? S.sessions.find((x) => x.id === a.sessionId) : null;
  let main;
  if (task) {
    const needPrep = task.prepSec > 0 && !locked && a.prepLeft !== 0;
    main = `<div class="practice-grid"><div class="card recorder-card">${needPrep ? prepCard(task.prepSec, task.speakSec, "assessment") : recorderCard("assessment", { limit: task.speakSec, title: task.title[S.lang] })}</div>
      <div class="side-panel"><div class="card card-tight stack-sm"><span class="badge badge-accent" style="justify-self:start">${esc(t("assess.task"))}</span><h3>${esc(task.title[S.lang])}</h3><p lang="en" style="white-space:pre-line">${esc(task.prompt)}</p></div>${locked ? liveFeedbackCard() : ""}</div></div>
      ${Speech.owner === "assessment" && Speech.state === "stopped" ? `<section style="margin-top:24px">${reportHtml(session, a.phase, a.error, "assess-retry")}</section>` : ""}`;
  } else {
    const mine = TASKS.filter((x) => x.levels.includes(S.profile.level)), others = TASKS.filter((x) => !x.levels.includes(S.profile.level));
    main = `<section class="stack"><h2>${esc(t("assess.forLevel"))} · ${esc(S.profile.level)}</h2><div class="cards-auto">${mine.map(card).join("")}</div></section>${others.length ? `<section class="stack"><h2>${esc(t("assess.otherTasks"))}</h2><div class="cards-auto">${others.map(card).join("")}</div></section>` : ""}`;
  }
  return `<div class="stack-lg"><div class="page-head" style="margin-bottom:0"><div><h1>${esc(t("assess.title"))}</h1><p>${esc(t("assess.sub"))}</p></div>${task ? `<button class="btn btn-ghost" data-act="assess-back" ${locked && Speech.state !== "stopped" ? "disabled" : ""}>${ic("left")} ${esc(t("assess.chooseAnother"))}</button>` : ""}</div>
    <div class="alert alert-accent">${ic("shield")}<span>${esc(t("assess.disclaimer"))}</span></div>
    ${main}
    <div class="card"><div class="card-header"><h2>${esc(t("assess.history"))}</h2></div>${hist.length ? `<div class="list">${hist.map(sessionRow).join("")}</div>` : empty("clip", t("assess.historyEmpty"))}</div></div>`;
}

// ---------- conversation ----------
function pConversation() {
  const c = S.conv;
  if (S.convSummary) {
    const s = S.sessions.find((x) => x.id === S.convSummary.id) || S.convSummary.session;
    return `<div class="stack-lg"><div class="page-head"><div><h1>${esc(t("conv.summary"))}</h1><p>${esc(sessionTitle(s))} · ${esc(s.level)}</p></div>${S.convSummary.phase !== "analyzing" ? `<button class="btn btn-primary" data-act="conv-new">${ic("plus")} ${esc(t("conv.new"))}</button>` : ""}</div>
      ${reportHtml(s, S.convSummary.phase, S.convSummary.error, "conv-retry")}
      <div class="card stack"><h2>${esc(t("conv.title"))}</h2>${(s.messages || []).map(bubble).join("")}</div></div>`;
  }
  if (!c) {
    const past = S.sessions.filter((s) => s.kind === "conversation").slice(0, 6);
    const sel = S.convSetup || { topicId: "", level: S.profile.level };
    S.convSetup = sel;
    const topic = topicById(sel.topicId);
    return `<div><div class="page-head"><div><h1>${esc(t("conv.title"))}</h1><p>${esc(t("conv.sub"))}</p></div></div>
      ${!S.caps.sample ? `<div class="alert alert-warning" style="margin-bottom:20px">${ic("alert")}<span>${esc(t("web.aiOff"))}</span></div>` : ""}
      <div class="chat-layout"><div class="card stack-lg"><h2>${esc(t("conv.setup"))}</h2>
        <div class="grid-2"><div class="field"><label for="conv-topic">${esc(t("conv.topic"))}</label><select id="conv-topic" class="select"><option value="">${esc(t("conv.freeTopic"))}</option>${TOPICS.map((x) => `<option value="${x.id}" ${x.id === sel.topicId ? "selected" : ""}>${esc(x.title[S.lang])}${x.kind === "roleplay" ? " · " + esc(t("topics.roleplay")) : ""}</option>`).join("")}</select></div>
        <div class="field"><label for="conv-level">${esc(t("common.level"))}</label><select id="conv-level" class="select">${LEVELS.map((l) => `<option ${l === sel.level ? "selected" : ""}>${l}</option>`).join("")}</select></div></div>
        ${topic ? `<div class="alert alert-accent">${ic("info")}<div><strong>${esc(topic.title[S.lang])}</strong><p class="small">${esc(topic.description[S.lang])}</p></div></div>` : ""}
        <div class="field"><span class="label">${esc(t("conv.corrections"))}</span><div class="seg" role="group"><button type="button" data-corr="during" aria-pressed="${S.profile.corrections === "during"}">${esc(t("conv.during"))}</button><button type="button" data-corr="after" aria-pressed="${S.profile.corrections !== "during"}">${esc(t("conv.after"))}</button></div></div>
        ${S.convStartError ? `<div class="alert alert-danger" role="alert">${ic("alert")}<span>${esc(errText(S.convStartError))}</span></div>` : ""}
        <div><button class="btn btn-primary btn-lg" data-act="conv-start" ${!S.caps.sample || S.convStarting ? "disabled" : ""}>${S.convStarting ? '<span class="spinner"></span> ' + esc(t("conv.starting")) : ic("chat") + " " + esc(t("conv.start"))}</button></div></div>
      <div class="card"><div class="card-header"><h2>${esc(t("conv.past"))}</h2></div>${past.length ? `<div class="list">${past.map(sessionRow).join("")}</div>` : empty("chat", t("conv.pastEmpty"))}</div></div></div>`;
  }
  const topic = topicById(c.topicId);
  const lastA = [...c.messages].reverse().find((m) => m.role === "assistant");
  const mine = Speech.owner === "conversation";
  const capturing = mine && ["listening", "paused", "pausing", "stopping"].includes(Speech.state);
  const reviewing = mine && Speech.state === "stopped";
  let composer;
  if (capturing) {
    composer = `<div class="voice-strip ${Speech.state === "paused" ? "paused" : ""}"><span class="rec-timer" style="font-size:1.1rem" data-timer>${fmt(Speech.sec())}</span><span class="small interim" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" lang="en" data-voice-text>${esc([Speech.text(), Speech.partial].filter(Boolean).join(" ") || t("conv.recordingNow"))}</span>
      ${Speech.state === "listening" ? `<button class="btn btn-secondary btn-icon btn-sm" data-act="rec-pause" aria-label="${esc(t("rec.pause"))}">${ic("pause")}</button>` : Speech.state === "paused" ? `<button class="btn btn-secondary btn-icon btn-sm" data-act="rec-resume" aria-label="${esc(t("rec.resume"))}">${ic("play")}</button>` : ""}
      <button class="btn btn-primary btn-sm" data-act="rec-stop" ${Speech.state === "stopping" || Speech.state === "pausing" ? "disabled" : ""}>${ic("stop")} ${esc(t("conv.doneSpeaking"))}</button></div>`;
  } else if (reviewing) {
    const txt = c.voiceDraft ?? Speech.text();
    composer = txt.trim() || c.voiceDraft != null
      ? `<span class="small muted">${esc(t("conv.review"))}</span><textarea class="textarea" id="voice-draft" lang="en" rows="3">${esc(txt)}</textarea><div class="row"><button class="btn btn-primary" data-act="send-voice" ${c.sending ? "disabled" : ""}>${ic("send")} ${esc(t("conv.send"))}</button><button class="btn btn-ghost" data-act="discard-voice">${ic("trash")} ${esc(t("conv.discardVoice"))}</button></div>`
      : `<p class="small" style="color:var(--warning)">${esc(t("conv.noSpeech"))}</p><div class="row"><button class="btn btn-ghost" data-act="discard-voice">${esc(t("common.close"))}</button></div>`;
  } else {
    composer = `<div class="composer-row">${S.caps.dictation ? `<button class="btn btn-primary btn-icon" data-act="rec-start" data-owner="conversation" aria-label="${esc(t("conv.speak"))}" title="${esc(t("conv.speak"))}" ${c.sending ? "disabled" : ""}>${ic("mic")}</button>` : ""}
      <textarea class="textarea" id="chat-input" rows="1" lang="en" placeholder="${esc(t("conv.typePh"))}" aria-label="${esc(t("conv.typePh"))}">${esc(c.draft || "")}</textarea>
      <button class="btn btn-secondary btn-icon" data-act="send-text" aria-label="${esc(t("conv.send"))}" ${c.sending ? "disabled" : ""}>${ic("send")}</button></div>
      ${!S.caps.dictation ? `<p class="small muted">${esc(t("web.noDictation"))}</p>` : ""}`;
  }
  return `<div class="chat-layout"><div class="card chat-card">
    <div class="chat-head"><div class="row"><span class="icon-chip sm">${ic("chat")}</span><div><strong>${esc(topic ? topic.title[S.lang] : t("conv.freeTopic"))}</strong><div class="small muted">${esc(c.level)}${topic && topic.kind === "roleplay" ? " · " + esc(t("topics.roleplay")) : ""}</div></div></div>
      <div class="row">${capturing && Speech.state === "listening" ? `<span class="badge badge-success"><span class="dot pulse"></span>${esc(t("stt.live"))}</span>` : ""}<button class="btn btn-secondary btn-sm" data-act="conv-end" ${c.sending || !c.messages.some((m) => m.role === "user") ? "disabled" : ""}>${esc(t("conv.end"))}</button></div></div>
    <div class="chat-scroll"><div class="stack">
      ${c.messages.map((m, i) => bubble(m, i, !capturing)).join("")}
      ${c.sending ? `<div class="msg user"><div class="msg-bubble" lang="en" style="opacity:.85">${esc(c.sending.text)}</div></div><div class="msg assistant pending"><div class="msg-bubble"><span class="typing" aria-label="${esc(t("conv.thinking"))}"><span></span><span></span><span></span></span></div></div>` : ""}
      ${c.failed ? `<div class="msg user"><div class="msg-bubble" lang="en" style="opacity:.6">${esc(c.failed.text)}</div><div class="msg-meta" role="alert" style="color:var(--danger)">${esc(t("conv.notSent"))} ${esc(errText(c.failed.code))}<button class="btn btn-ghost btn-sm" data-act="retry-send">${esc(t("common.retry"))}</button><button class="btn btn-ghost btn-sm" data-act="edit-failed">${esc(t("common.edit"))}</button></div></div>` : ""}
    </div>
    ${!c.sending && !capturing && !reviewing && lastA && lastA.starters && lastA.starters.length ? `<div class="stack-sm"><span class="small muted row">${ic("bulb")} ${esc(t("conv.starters"))}</span><div class="starters" lang="en">${lastA.starters.map((s) => `<button type="button" data-starter="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>` : ""}

async function convStart() {
  playUnlock();
  S.convStarting = true; S.convStartError = null; render();
  const sel = S.convSetup;
  const conv = { id: uid(), topicId: sel.topicId || null, level: sel.level, messages: [], sending: null, failed: null, startedAt: Date.now() };
  try {
    const r = await partnerTurn(conv);
    conv.messages.push({ role: "assistant", content: r.reply, starters: r.starters });
    S.conv = conv;
    await saveConv();
    autoSpeakLast();
  } catch (e) { S.convStartError = e.code || "ai_unavailable"; }
  S.convStarting = false; render();
}
function convSession(conv, status = "active") {
  const learner = conv.messages.filter((m) => m.role === "user");
  return {
    id: conv.id, kind: "conversation", topicId: conv.topicId, taskId: null, level: conv.level, startedAt: conv.startedAt,
    durationSec: Math.min((Date.now() - conv.startedAt) / 1000, 45 * 60), wordCount: learner.reduce((a, m) => a + words(m.content).length, 0),
    transcript: learner.map((m) => m.content).join("\n"), messages: conv.messages.map((m) => ({ role: m.role, content: m.content, mode: m.mode || null, original: m.original || null, correction: m.correction || null, starters: m.starters || [] })),
    status, reportStatus: "none", report: null,
  };
}
async function saveConv(status) {
  const prev = S.sessions.find((x) => x.id === S.conv.id);
  const s = convSession(S.conv, status || (prev && prev.status) || "active");
  if (prev && prev.report) { s.report = prev.report; s.reportStatus = prev.reportStatus; }
  await Store.saveSession(s).catch((e) => console.warn(e));
}
async function sendTurn(text, mode, original) {
  const c = S.conv;
  if (!c || c.sending || !text.trim()) return;           // each confirmed turn is sent once
  c.sending = { text: text.trim(), mode, original }; c.failed = null; c.draft = "";
  render();
  const attempt = { ...c, messages: [...c.messages, { role: "user", content: text.trim(), mode, original }] };
  try {
    const r = await partnerTurn(attempt);
    if (S.conv !== c) return;
    const um = { role: "user", content: text.trim(), mode, original: original || null };
    if (r.correction) um.correction = r.correction;
    c.messages.push(um, { role: "assistant", content: r.reply, starters: r.starters });
    c.sending = null;
    render();
    autoSpeakLast();
    saveConv();
  } catch (e) {
    if (S.conv !== c) return;
    c.failed = { text: text.trim(), mode, original, code: e.code || "ai_unavailable" }; c.sending = null; render();
  }
}
function autoSpeakLast() {
  const c = S.conv; if (!c || !S.caps.tts || Speech.busy()) return;
  const i = c.messages.length - 1; const m = c.messages[i];
  if (m && m.role === "assistant") Voice.speak("m-" + i, m.content);
}
function playUnlock() {}
async function convEnd() {
  const c = S.conv; if (!c) return;
  Speech.reset(false); Voice.stop();
  const s = convSession(c, "completed");
  S.convSummary = { id: c.id, phase: "analyzing", session: s };
  S.conv = null; render();
  await Store.saveSession(s).catch(() => {});
  await convReport(s);
}
async function convReport(s) {
  const text = s.messages.filter((m) => m.role === "user").map((m, i) => `Turn ${i + 1}: ${m.content}`).join("\n");
  const voiceSec = 0;
  const metrics = computeMetrics(s.transcript, s.durationSec, []);
  metrics.wpm = null; // typed and spoken turns are mixed: pace over wall-clock time would mislead
  s.metrics = metrics;
  if (s.wordCount < 20) {
    s.report = { insufficient: true, wordCount: s.wordCount }; s.reportStatus = "insufficient";
    await Store.saveSession(s).catch(() => {}); S.convSummary.phase = "ready"; render(); return;
  }
  S.convSummary.phase = "analyzing"; render();
  try {
    const ai = await buildReport({ kind: "conversation", text, metrics, level: s.level, topicId: s.topicId });
    s.report = { ai, generatedAt: Date.now() }; s.reportStatus = "ready";
    await Store.saveSession(s).catch(() => {});
    S.convSummary.phase = "ready";
  } catch (e) {
    s.reportStatus = "failed"; Store.saveSession(s).catch(() => {});
    S.convSummary.phase = "failed"; S.convSummary.error = e.code;
  }
  S.convSummary.session = s; render();
  void voiceSec;
}

}

// ---------- progress ----------
function barChart(points, unit, color, goal) {
  const W = 640, H = 220, P = { l: 36, r: 12, t: 12, b: 28 };
  const max0 = Math.max(1, goal || 0, ...points.map((p) => p.v));
  const pw = Math.pow(10, Math.floor(Math.log10(max0))), nn = max0 / pw, max = (nn <= 1 ? 1 : nn <= 2 ? 2 : nn <= 5 ? 5 : 10) * pw;
  const ih = H - P.t - P.b, iw = W - P.l - P.r, slot = iw / points.length, bw = Math.max(4, Math.min(28, slot - 6));
  const every = Math.ceil(points.length / 7);
  let g = [0, max / 2, max].map((tk) => { const y = P.t + ih - (tk / max) * ih; return `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${Number.isInteger(tk) ? tk : tk.toFixed(1)}</text>`; }).join("");
  if (goal) { const y = P.t + ih - (goal / max) * ih; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="#15875a" stroke-dasharray="4 4" stroke-width="1.5"/>`; }
  points.forEach((p, i) => {
    const h = (p.v / max) * ih, x = P.l + slot * i + (slot - bw) / 2, y = P.t + ih - h, r = Math.min(4, bw / 2, h);
    if (h > 0) g += `<path d="M${x},${P.t + ih} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${P.t + ih} Z" fill="${color}"><title>${esc(p.full)}: ${p.v} ${esc(unit)}</title></path>`;
    g += `<rect x="${P.l + slot * i}" y="${P.t}" width="${slot}" height="${ih}" fill="transparent"><title>${esc(p.full)}: ${p.v} ${esc(unit)}</title></rect>`;
    if (i % every === 0 || i === points.length - 1) g += `<text x="${P.l + slot * (i + 0.5)}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineChart(points, unit) {
  const W = 640, H = 220, P = { l: 36, r: 12, t: 12, b: 28 };
  const max = Math.max(5, ...points.map((p) => p.v));
  const ih = H - P.t - P.b, iw = W - P.l - P.r, slot = iw / points.length, every = Math.ceil(points.length / 7);
  const xy = (i) => [P.l + slot * (i + 0.5), P.t + ih - (points[i].v / max) * ih];
  const d = points.map((_, i) => (i ? "L" : "M") + xy(i).join(",")).join(" ");
  let g = [0, max / 2, max].map((tk) => { const y = P.t + ih - (tk / max) * ih; return `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${P.l - 6}" y="${y + 4}" text-anchor="end">${Math.round(tk)}</text>`; }).join("");
  g += `<path d="${d} L${xy(points.length - 1)[0]},${P.t + ih} L${xy(0)[0]},${P.t + ih} Z" fill="#5d3fe0" opacity="0.08"/><path d="${d}" fill="none" stroke="#5d3fe0" stroke-width="2"/>`;
  points.forEach((p, i) => { g += `<circle cx="${xy(i)[0]}" cy="${xy(i)[1]}" r="${i === points.length - 1 ? 4.5 : 3}" fill="#5d3fe0"><title>${esc(p.full)}: ${p.v} ${esc(unit)}</title></circle>`; if (i % every === 0 || i === points.length - 1) g += `<text x="${xy(i)[0]}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

        <p class="small muted">${esc(t("prog.timezoneNote", { tz: st.tz }))}</p></div>

    <div class="card"><div class="card-header"><h2>${esc(t("prog.history"))}</h2></div>${S.sessions.length ? `<div class="list">${S.sessions.slice(0, 50).map(sessionRow).join("")}</div>` : empty("clock", t("dash.recentEmpty"))}</div></div>`;

    ${s.kind === "conversation" ? `<div class="card stack"><h2>${esc(t("conv.title"))}</h2>${(s.messages || []).map((m, i) => bubble(m, i)).join("")}</div>`

    ${ph ? reportHtml(s, ph.phase, ph.error, "session-report") : s.report ? reportHtml(s, "ready") : (s.transcript ? `<div class="card row-between"><span class="muted">${esc(t("session.noReport"))}</span><button class="btn btn-primary" data-act="session-report" ${S.caps.sample ? "" : "disabled"}>${esc(t("report.generate"))}</button></div>` : "")}</div>`;
}

      <div class="metric-row"><span>${esc(t("set.serviceAi"))}</span>${ok(S.caps.sample)}</div><div class="metric-row"><span>${esc(t("set.serviceStt"))}</span>${ok(S.caps.dictation)}</div><div class="metric-row"><span>${esc(t("set.serviceTts"))}</span>${ok(S.caps.tts)}</div></div>
      <div class="card stack"><h2>${esc(t("set.privacy"))}</h2><p class="muted small">${esc(t("web.micNote"))}</p><div><button class="btn btn-danger" data-act="delete-all">${ic("trash")} ${esc(t("set.deleteData"))}</button></div></div></div></div>`;

// ============================================================
// Events
// ============================================================
function setLangLocal(l) {
  S.lang = l;
  try { localStorage.setItem("speakup.lang", l); } catch {}
}
async function setLang(l) {
  setLangLocal(l);
  render();
  if (S.profile && S.profile.onboarded && S.profile.lang !== l) await Store.saveProfile({ ...S.profile, lang: l }).catch(() => {});
}
function go(route) { if (location.hash !== "#" + route) location.hash = route; else { S.route = route; render(); } }
function startTopic(id) {
  const x = topicById(id);
  if (!x) return;
  if (x.kind === "ielts") { S.rec = { topicId: id, phase: "idle", sessionId: null }; go("recorder"); }
  else { S.conv = null; S.convSummary = null; S.convSetup = { topicId: id, level: S.profile.level }; go("conversation"); }
}

function bind() {
  const app = document.body;
  app.querySelectorAll("[data-lang]").forEach((b) => b.onclick = () => setLang(b.dataset.lang));
  app.querySelectorAll("[data-act]").forEach((b) => b.addEventListener(b.tagName === "FORM" ? "submit" : "click", onAct));
  app.querySelectorAll("[data-speak]").forEach((b) => b.onclick = () => Voice.speak(b.dataset.speak, b.dataset.text));
  app.querySelectorAll("[data-save]").forEach((b) => b.onclick = () => { b.disabled = true; saveWord(b.dataset.save, b.dataset.source, b.dataset.example); });
  app.querySelectorAll("[data-start-topic]").forEach((b) => b.onclick = () => startTopic(b.dataset.startTopic));
  app.querySelectorAll("[data-rec-topic]").forEach((b) => b.onclick = () => { S.rec = { topicId: b.dataset.recTopic, phase: "idle", sessionId: null }; go("recorder"); });
  app.querySelectorAll("[data-onb-level]").forEach((b) => b.onclick = () => { ONB.level = b.dataset.onbLevel; render(); });
  app.querySelectorAll("[data-onb-goal]").forEach((b) => b.onclick = () => { ONB.goal = b.dataset.onbGoal; render(); });
  app.querySelectorAll("[data-onb-target]").forEach((b) => b.onclick = () => { ONB.target = Number(b.dataset.onbTarget); render(); });
  const onbName = $("#onb-name"); if (onbName) onbName.oninput = (e) => (ONB.name = e.target.value);
  const rt = $("#rec-topic"); if (rt) rt.onchange = (e) => { S.rec = { topicId: e.target.value || null, phase: "idle", sessionId: null }; render(); };
  const ct = $("#conv-topic"); if (ct) ct.onchange = (e) => { S.convSetup.topicId = e.target.value; render(); };
  const cl = $("#conv-level"); if (cl) cl.onchange = (e) => { S.convSetup.level = e.target.value; };
  app.querySelectorAll("[data-corr]").forEach((b) => b.onclick = async () => { await Store.saveProfile({ ...S.profile, corrections: b.dataset.corr }).catch(() => {}); render(); });
  const ci = $("#chat-input");
  if (ci) {
    ci.oninput = (e) => (S.conv.draft = e.target.value);
    ci.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendTurn(ci.value, "text"); } };
  }
  const vd = $("#voice-draft"); if (vd) vd.oninput = (e) => (S.conv.voiceDraft = e.target.value);
  app.querySelectorAll("[data-starter]").forEach((b) => b.onclick = () => { S.conv.draft = ((S.conv.draft || "") + " " + b.dataset.starter).trim(); render(); const i = $("#chat-input"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } });
  app.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => { const st = S.route === "assessment" ? S.assess : S.rec; st.view = b.dataset.view; render(); });
  app.querySelectorAll("[data-tfilter]").forEach((b) => b.onclick = () => { S.topicFilter = b.dataset.tfilter; render(); });
  const al = $("#all-levels"); if (al) al.onchange = (e) => { S.allLevels = e.target.checked; render(); };
  app.querySelectorAll("[data-task]").forEach((b) => b.onclick = () => { if (Speech.owner === "assessment") Speech.reset(false); S.assess = { taskId: b.dataset.task, phase: "idle" }; render(); window.scrollTo(0, 0); });
  app.querySelectorAll("[data-vtab]").forEach((b) => b.onclick = () => { S.vocabTab = b.dataset.vtab; S.card = 0; S.flipped = false; render(); });
  app.querySelectorAll("[data-vstatus]").forEach((b) => b.onclick = () => { S.vocabStatus = b.dataset.vstatus; render(); });
  const vq = $("#vocab-q"); if (vq) vq.oninput = (e) => { S.vocabQ = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#vocab-q"); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll("[data-vlearned]").forEach((b) => b.onclick = () => updVocab(b.dataset.vlearned, { status: "learned" }));
  app.querySelectorAll("[data-vlearning]").forEach((b) => b.onclick = () => updVocab(b.dataset.vlearning, { status: "learning" }));
  app.querySelectorAll("[data-vremove]").forEach((b) => b.onclick = async () => { if (await confirmDialog(t("vocab.removeConfirm"))) { await Store.deleteVocab(b.dataset.vremove).catch(() => {}); render(); } });
  app.querySelectorAll("[data-define]").forEach((b) => b.onclick = async () => { b.disabled = true; const v = S.vocab.find((x) => x.id === b.dataset.define); try { const d = await defineTerm(v.term, v.example); await Store.saveVocab({ ...v, meaning: d.meaning, example: v.example || d.example }); } catch (e) { toast(errText(e.code), "error"); } render(); });
  app.querySelectorAll("[data-card]").forEach((b) => b.onclick = () => { const n = (S.vocabQ || S.vocabStatus !== "all") ? Math.max(1, S.vocab.length) : S.vocab.length; S.card = (S.card + Number(b.dataset.card) + n) % n; S.flipped = false; render(); });
  app.querySelectorAll("[data-review]").forEach((b) => b.onclick = () => reviewAnswer(b.dataset.review === "1"));
  app.querySelectorAll("[data-pdays]").forEach((b) => b.onclick = () => { S.progDays = Number(b.dataset.pdays); render(); });
  // selection → save phrase (transcript and chat)
  const selbar = $("[data-selbar]");
  if (selbar) selbar.dataset.bound = "1";
}
document.addEventListener("selectionchange", () => {
  const bar = document.querySelector("[data-selbar]");
  if (!bar) return;
  const sel = window.getSelection(); const text = sel ? sel.toString().trim() : "";
  const host = sel && sel.anchorNode && (sel.anchorNode.parentElement || sel.anchorNode).closest && (sel.anchorNode.parentElement || sel.anchorNode).closest(".transcript-box, .chat-scroll");
  if (text && host && words(text).length <= 8) {
    bar.innerHTML = `<button type="button" class="btn btn-soft btn-sm">${ic("save")} ${esc(t("conv.saveSelection"))}: “${esc(text.length > 40 ? text.slice(0, 40) + "…" : text)}”</button>`;
    const btn = bar.querySelector("button");
    btn.onmousedown = (e) => e.preventDefault();
    btn.onclick = () => { saveWord(text, host.classList.contains("chat-scroll") ? "conversation" : "transcript"); bar.innerHTML = ""; window.getSelection().removeAllRanges(); };
  } else if (!text) bar.innerHTML = "";
});

async function updVocab(id, patch) {
  const v = S.vocab.find((x) => x.id === id); if (!v) return;
  await Store.saveVocab({ ...v, ...patch }).catch(() => {}); render();
}
async function reviewAnswer(knew) {
  const R = S.review; const v = S.vocab.find((x) => x.id === R.deck[R.i]);
  if (v) {
    const next = knew ? (v.status === "learning" ? "learned" : "learning") : "learning";
    await Store.saveVocab({ ...v, status: next, reviews: (v.reviews || 0) + 1, lastReviewed: Date.now() }).catch(() => {});
    if (next === "learned") toast(v.term + ": " + t("vocab.status.learned"));
  }
  if (knew) R.known++;
  R.i++; R.shown = false; render();
}

async function onAct(e) {
  const el = e.currentTarget, act = el.dataset.act;
  if (el.tagName === "FORM") e.preventDefault();
  switch (act) {
    case "sheet": S.sheet = true; render(); break;
    case "sheet-close": S.sheet = false; render(); break;
    case "onb-next": ONB.step++; render(); break;
    case "onb-back": ONB.step--; render(); break;
    case "onb-finish": {
      let tz = "UTC"; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch {}
      await Store.saveProfile({ name: ONB.name.trim(), level: ONB.level, goal: ONB.goal, target: ONB.target, lang: S.lang, tz, corrections: "after", onboarded: true, createdAt: Date.now() }).catch((err) => toast(errText(err && err.code), "error"));
      S.route = "dashboard"; render(); break;
    }
    case "rec-start": {
      const owner = el.dataset.owner;
      const st = owner === "recorder" ? S.rec : owner === "assessment" ? S.assess : null;
      if (st) { st.phase = "idle"; st.sessionId = null; st.report = null; st.view = "original"; st.editing = false; clearInterval(prepTimer); st.prepLeft = 0; }
      if (owner === "conversation" && S.conv) S.conv.voiceDraft = null;
      const ok = Speech.start(owner);
      if (ok) {
        const topic = owner === "recorder" && S.rec ? topicById(S.rec.topicId) : null;
        Speech.limit = owner === "assessment" ? (taskById(S.assess.taskId) || {}).speakSec || null : topic && topic.ielts ? topic.ielts.speakSec : null;
      }
      break;
    }
    case "rec-pause": Speech.pause(); break;
    case "rec-resume": Speech.resume(); break;
    case "rec-stop": Speech.stop(); break;
    case "rec-new": {
      const owner = Speech.owner; Speech.reset(false);
      const st = owner === "assessment" ? S.assess : S.rec; if (st) { st.phase = "idle"; st.sessionId = null; st.prepLeft = undefined; st.editing = false; }
      render(); break;
    }
    case "rec-discard": Speech.reset(); break;
    case "rec-delete": {
      if (!(await confirmDialog(t("rec.deleteConfirm")))) break;
      const owner = el.dataset.owner, st = owner === "assessment" ? S.assess : S.rec;
      const sid = st.sessionId;
      Speech.reset(false);    // bumps the generation: late AI results for this take are ignored
      st.phase = "idle"; st.sessionId = null; st.prepLeft = undefined; st.editing = false;
      if (sid) await Store.deleteSession(sid).catch(() => {});
      render(); break;
    }
    case "rec-retry": analyse(S.rec, S.rec.sessionId, Speech.gen); break;
    case "assess-retry": analyse(S.assess, S.assess.sessionId, Speech.gen); break;
    case "edit-open": { const st = el.dataset.owner === "assessment" ? S.assess : S.rec; st.editing = true; render(); break; }
    case "edit-cancel": { const st = el.dataset.owner === "assessment" ? S.assess : S.rec; st.editing = false; render(); break; }
    case "edit-save": {
      const st = el.dataset.owner === "assessment" ? S.assess : S.rec;
      const s = S.sessions.find((x) => x.id === st.sessionId); const val = $("#edit-text").value.trim();
      st.editing = false;
      if (s && val) { s.edited = val; s.wordCount = words(val).length; await Store.saveSession(s).catch(() => {}); st.view = "edited"; analyse(st, s.id, Speech.gen); }
      render(); break;
    }
    case "typed-use": {
      const owner = el.dataset.owner; const val = ($("#typed-" + owner) || {}).value || "";
      if (!val.trim()) break;
      Speech.reset(false); Speech.owner = owner; Speech.startedAt = Date.now();
      Speech.segments = [{ id: "typed-0", text: val.trim(), at: 0, start: 0 }];
      Speech.state = "stopped"; Speech.activeMs = 0;
      onTakeStopped(owner, Speech.gen); render(); break;
    }
    case "prep-start": {
      const st = el.dataset.owner === "assessment" ? S.assess : S.rec;
      const end = Date.now() + Number(el.dataset.sec) * 1000;
      st.prepLeft = Number(el.dataset.sec); render();
      clearInterval(prepTimer);
      prepTimer = setInterval(() => { st.prepLeft = Math.max(0, Math.ceil((end - Date.now()) / 1000)); const d = $("[data-prep]"); if (d) d.textContent = fmt(st.prepLeft); if (st.prepLeft === 0) { clearInterval(prepTimer); toast(t("ielts.speaking")); render(); } }, 250);
      break;
    }
    case "prep-skip": { const st = el.dataset.owner === "assessment" ? S.assess : S.rec; clearInterval(prepTimer); st.prepLeft = 0; render(); break; }
    case "assess-back": Speech.owner === "assessment" && Speech.reset(false); S.assess = { taskId: null }; render(); break;
    case "conv-start": convStart(); break;
    case "send-text": { const i = $("#chat-input"); sendTurn(i ? i.value : "", "text"); break; }
    case "send-voice": {
      const v = ($("#voice-draft") || {}).value || ""; const orig = Speech.text();
      Speech.reset(false); S.conv.voiceDraft = null;
      sendTurn(v, "voice", v.trim() !== orig.trim() ? orig : null); break;
    }
    case "discard-voice": Speech.reset(false); if (S.conv) S.conv.voiceDraft = null; render(); break;
    case "retry-send": { const f = S.conv.failed; S.conv.failed = null; sendTurn(f.text, f.mode, f.original); break; }
    case "edit-failed": { S.conv.draft = S.conv.failed.text; S.conv.failed = null; render(); break; }
    case "conv-end": convEnd(); break;
    case "conv-new": S.convSummary = null; S.conv = null; render(); break;
    case "conv-retry": { const s = S.convSummary.session; S.convSummary.phase = "analyzing"; render(); convReport(s); break; }
    case "all-levels": S.allLevels = true; render(); break;
    case "vocab-add-toggle": S.vocabAdding = !S.vocabAdding; S.vocabTab = "list"; render(); break;
    case "vocab-add": {
      const term = $("#v-term").value.trim(), meaning = $("#v-meaning").value.trim(), example = $("#v-example").value.trim();
      if (!term) break;
      S.vocabAdding = false;
      if (meaning) {
        if (S.vocab.some((v) => v.term.toLowerCase() === term.toLowerCase())) { toast(t("vocab.already")); render(); break; }
        await Store.saveVocab({ id: uid(), term, meaning, example, source: "manual", status: "new", reviews: 0, createdAt: Date.now() }).catch(() => {});
        toast(t("vocab.savedOk")); render();
      } else saveWord(term, "manual", example);
      break;
    }
    case "flip": S.flipped = !S.flipped; render(); break;
    case "review-start": { const c = S.vocab.filter((v) => v.status !== "learned").sort(() => Math.random() - 0.5).slice(0, 8).map((v) => v.id); S.review = { deck: c, i: 0, known: 0, shown: false }; render(); break; }
    case "review-show": S.review.shown = true; render(); break;
    case "prefs": {
      const lang = $("#p-lang").value;
      await Store.saveProfile({ ...S.profile, name: $("#p-name").value.trim(), level: $("#p-level").value, goal: $("#p-goal").value, target: Number($("#p-target").value), tz: $("#p-tz").value, lang }).catch(() => {});
      setLangLocal(lang); toast(t("set.saved")); render(); break;
    }
    case "delete-all": {
      if (!(await confirmDialog(t("set.deleteDataConfirm")))) break;
      for (const s of [...S.sessions]) await Store.deleteSession(s.id).catch(() => {});
      for (const v of [...S.vocab]) await Store.deleteVocab(v.id).catch(() => {});
      toast(t("set.dataDeleted")); render(); break;
    }
    case "session-delete": {
      if (!(await confirmDialog(t("session.deleteConfirm")))) break;
      await Store.deleteSession(el.dataset.id).catch(() => {}); go("progress"); break;
    }
    case "session-report": {
      const id = S.route.slice(8); const s = S.sessions.find((x) => x.id === id); if (!s) break;
      S.sessionPhase = { id, phase: "analyzing" }; render();
      try {
        const text = s.kind === "conversation" ? (s.messages || []).filter((m) => m.role === "user").map((m, i) => `Turn ${i + 1}: ${m.content}`).join("\n") : s.edited || s.transcript;
        if (words(text).length < 20) { s.report = { insufficient: true, wordCount: words(text).length }; s.reportStatus = "insufficient"; }
        else { const ai = await buildReport({ kind: s.kind, text, metrics: s.metrics || computeMetrics(text, s.durationSec, []), level: s.level, topicId: s.topicId, taskId: s.taskId, edited: !!s.edited }); s.report = { ai, edited: !!s.edited, generatedAt: Date.now() }; s.reportStatus = "ready"; s.estimate = ai.cefr_estimate || ai.ielts_band_estimate != null ? { cefr: ai.cefr_estimate, ielts: ai.ielts_band_estimate } : null; }
        await Store.saveSession(s).catch(() => {});
        S.sessionPhase = null;
      } catch (err) { S.sessionPhase = { id, phase: "failed", error: err.code }; }
      render(); break;
    }
  }
}

// ---------- routing ----------
function onHash() {
  const h = (location.hash || "#dashboard").slice(1) || "dashboard";
  const valid = NAV.some((n) => n[0] === h) || h.startsWith("session-");
  S.route = valid ? h : "dashboard";
  S.sheet = false;
  // Leaving a page while speaking pauses that take (nothing is discarded).
  if (Speech.state === "listening" && Speech.owner !== S.route && !(Speech.owner === "conversation" && S.route === "conversation")) Speech.pause();
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", onHash);

// ---------- start ----------
(async function init() {
  const use = (n) => (window.claude && typeof window.claude.use === "function" ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, sample, dictation, tts] = await Promise.all([use("db"), use("user"), use("sample"), use("dictation"), use("tts")]);
  S.caps = { db, user, sample, dictation, tts };
  if (tts) tts.onState(({ state }) => { if (state === "idle" && S.ttsState.speakingKey) { S.ttsState.speakingKey = null; updateSpeakButtons(); } });
  let id = null;
  if (user && db) { try { id = await user.id(); } catch {} }
  if (db && id) { S.uid = id; S.remote = true; subscribeRemote(); }
  else {
    const l = Store.local.read();
    S.profile = l.profile; S.sessions = l.sessions || []; S.vocab = l.vocab || [];
    S.ready = true;
  }
  const h = (location.hash || "").slice(1);
  if (h) S.route = NAV.some((n) => n[0] === h) || h.startsWith("session-") ? h : "dashboard";
  render();
})();
render();
</script>
