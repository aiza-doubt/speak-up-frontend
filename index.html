<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Up · by JAZ Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>


:root {
  --bg: #f7f8fc;
  --surface: #ffffff;
  --surface-2: #f2f3f8;
  --text: #17233d;
  --text-2: #3f4b66;
  --text-3: #5f6a85;
  --border: #e5e7f0;
  --border-strong: #d3d7e6;
  --accent: #795af6;
  --accent-strong: #5d3fe0; /* AA-contrast accent for text and buttons */
  --accent-soft: #eee9ff;
  --accent-softer: #f6f3ff;
  --lilac: #c8b8ff;
  --success: #15875a;
  --success-soft: #e3f4ec;
  --warning: #b66a16;
  --warning-soft: #fbf0e1;
  --danger: #c83d49;
  --danger-soft: #fbe8ea;
  --info-soft: #eaf1fd;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow-sm: 0 1px 2px rgba(23, 35, 61, 0.05);
  --shadow: 0 1px 2px rgba(23, 35, 61, 0.04), 0 8px 24px rgba(23, 35, 61, 0.06);
  --shadow-lg: 0 2px 6px rgba(23, 35, 61, 0.05), 0 24px 48px rgba(52, 33, 140, 0.12);
  --grad: linear-gradient(135deg, #6f4ff2 0%, #8f72ff 55%, #b39dff 100%);
  --grad-soft: linear-gradient(160deg, #f4f0ff 0%, #f7f8fc 60%);
  --font: "Inter Variable", "Inter", "Segoe UI", "Noto Sans", Roboto, system-ui, -apple-system, sans-serif;
  --sidebar-w: 264px;
  --topbar-h: 68px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 {
  margin: 0;
  line-height: 1.2;
  letter-spacing: -0.02em;
  font-weight: 700;
  color: var(--text);
}
h1 { font-size: clamp(1.6rem, 2.4vw, 2rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent-strong); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { display: block; }
:focus-visible {
  outline: 3px solid rgba(121, 90, 246, 0.55);
  outline-offset: 2px;
  border-radius: 10px;
}
.sr-only {
  position: absolute !important;
  width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 100;
  background: var(--text); color: #fff; padding: 10px 16px; border-radius: 10px;
}
.skip-link:focus { top: 12px; }

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent;
  font-weight: 600; font-size: 0.95rem; cursor: pointer; white-space: nowrap;
  transition: background 0.15s var(--ease), border-color 0.15s, box-shadow 0.15s, transform 0.1s, color 0.15s;
  text-decoration: none !important; user-select: none;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--accent-strong); color: #fff; box-shadow: 0 6px 16px rgba(93, 63, 224, 0.25); }
.btn-primary:hover:not(:disabled) { background: #5032d2; }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-strong); }
.btn-soft { background: var(--accent-soft); color: var(--accent-strong); }
.btn-soft:hover:not(:disabled) { background: #e4dcff; }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--surface); color: var(--danger); border-color: #efc4c9; }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 0.875rem; border-radius: 10px; }
.btn-sm svg { width: 16px; height: 16px; }
.btn-lg { min-height: 52px; padding: 0 24px; font-size: 1rem; border-radius: 14px; }
.btn-icon { width: 44px; padding: 0; }
.btn-icon.btn-sm { width: 36px; }
.btn-block { width: 100%; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px;
}
.card-tight { padding: 18px; }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-header h2, .card-header h3 { display: flex; align-items: center; gap: 10px; }
.icon-chip {
  width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-strong);
  display: inline-grid; place-items: center; flex: none;
}
.icon-chip svg { width: 20px; height: 20px; }
.icon-chip.sm { width: 32px; height: 32px; border-radius: 10px; }
.icon-chip.sm svg { width: 16px; height: 16px; }
.icon-chip.green { background: var(--success-soft); color: var(--success); }
.icon-chip.amber { background: var(--warning-soft); color: var(--warning); }
.icon-chip.red { background: var(--danger-soft); color: var(--danger); }

.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  font-size: 0.78rem; font-weight: 600; background: var(--surface-2); color: var(--text-2); white-space: nowrap;
}
.badge svg { width: 13px; height: 13px; }
.badge-accent { background: var(--accent-soft); color: var(--accent-strong); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-outline { background: transparent; border: 1px solid var(--border-strong); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.dot.pulse { animation: pulse 1.4s ease-in-out infinite; }

.field { display: grid; gap: 6px; }
.field label, .label { font-size: 0.875rem; font-weight: 600; color: var(--text-2); }
.hint { font-size: 0.82rem; color: var(--text-3); }
.input, .select, .textarea {
  width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--border-strong); background: var(--surface); transition: border-color 0.15s, box-shadow 0.15s;
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.55; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(121, 90, 246, 0.15); }
.input[aria-invalid="true"] { border-color: var(--danger); }

.seg { display: inline-flex; padding: 4px; background: var(--surface-2); border-radius: 12px; gap: 2px; flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 0.85rem;
  color: var(--text-2); cursor: pointer; min-height: 36px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow-sm); }

.alert {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px;
  background: var(--info-soft); color: var(--text); font-size: 0.92rem;
}
.alert svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.alert .alert-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.alert-warning { background: var(--warning-soft); }
.alert-warning > svg { color: var(--warning); }
.alert-danger { background: var(--danger-soft); }
.alert-danger > svg { color: var(--danger); }
.alert-success { background: var(--success-soft); }
.alert-success > svg { color: var(--success); }
.alert-accent { background: var(--accent-softer); border: 1px solid var(--accent-soft); }
.alert-accent > svg { color: var(--accent-strong); }

.empty {
  text-align: center; padding: 36px 20px; color: var(--text-3); display: grid; justify-items: center; gap: 12px;
}
.empty .icon-chip { width: 56px; height: 56px; border-radius: 18px; }
.empty .icon-chip svg { width: 26px; height: 26px; }
.empty p { max-width: 420px; }

.muted { color: var(--text-3); }
.small { font-size: 0.86rem; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 8px; }
.stack-lg { display: grid; gap: 24px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cards-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.divider { height: 1px; background: var(--border); margin: 8px 0; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent;
  animation: spin 0.8s linear infinite; display: inline-block; flex: none;
}
.progress-bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress-bar > span { display: block; height: 100%; background: var(--grad); border-radius: inherit; transition: width 0.4s var(--ease); }
.progress-bar.done > span { background: var(--success); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(200, 61, 73, 0.35); } 100% { box-shadow: 0 0 0 22px rgba(200, 61, 73, 0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeUp 0.35s var(--ease) both; }

/* ---------- language switcher ---------- */
.lang-switch { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); }
.lang-switch button {
  border: 0; background: transparent; padding: 5px 9px; min-height: 32px; border-radius: 8px; cursor: pointer;
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em; color: var(--text-3);
}
.lang-switch button[aria-pressed="true"] { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow-sm); }

/* ---------- logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none !important; }
.logo-mark {
  width: 38px; height: 38px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; color: #fff;
  box-shadow: 0 6px 14px rgba(111, 79, 242, 0.3); flex: none;
}
.logo-mark svg { width: 20px; height: 20px; }
.logo-text { display: grid; line-height: 1.05; }
.logo-text strong { font-size: 1.08rem; letter-spacing: -0.02em; }
.logo-text span { font-size: 0.7rem; color: var(--text-3); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

/* ---------- app shell ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 22px 16px; display: flex; flex-direction: column; gap: 22px;
  background: var(--surface); border-right: 1px solid var(--border);
}
.sidebar nav { display: grid; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--text-2);
  font-weight: 550; font-size: 0.93rem; text-decoration: none !important; transition: background 0.15s, color 0.15s;
}
.nav-link svg { width: 19px; height: 19px; flex: none; }
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { background: var(--accent-soft); color: var(--accent-strong); }
.sidebar-cta { margin-top: auto; padding: 16px; border-radius: 16px; background: var(--grad-soft); border: 1px solid var(--accent-soft); display: grid; gap: 10px; }
.sidebar-cta p { font-size: 0.85rem; color: var(--text-2); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 0 32px; background: rgba(247, 248, 252, 0.85); backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid transparent;
}
.topbar .page-title { font-size: 1.05rem; font-weight: 650; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong);
  display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; border: 0; cursor: pointer;
}
.menu { position: relative; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 40;
}
.menu-pop .menu-head { padding: 10px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.menu-pop button, .menu-pop a {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border: 0; background: none; border-radius: 10px;
  color: var(--text); cursor: pointer; font-size: 0.92rem; text-align: left; text-decoration: none !important;
}
.menu-pop button:hover, .menu-pop a:hover { background: var(--surface-2); }
.menu-pop svg { width: 17px; height: 17px; }
.content { padding: 8px 32px 48px; max-width: 1240px; width: 100%; margin: 0 auto; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 12px 0 24px; flex-wrap: wrap; }
.page-head p { color: var(--text-3); margin-top: 6px; }

.bottom-nav { display: none; }
.mobile-logo { display: none; }

/* ---------- landing ---------- */
.landing { background: var(--bg); }
.l-header {
  position: sticky; top: 0; z-index: 30; background: rgba(247, 248, 252, 0.86); backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
}
.l-header-inner { max-width: 1200px; margin: 0 auto; height: 72px; display: flex; align-items: center; gap: 24px; padding: 0 24px; }
.l-nav { display: flex; gap: 4px; margin-left: 12px; }
.l-nav a { color: var(--text-2); font-weight: 550; font-size: 0.93rem; padding: 8px 12px; border-radius: 10px; }
.l-nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
.l-header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.l-section { max-width: 1200px; margin: 0 auto; padding: 88px 24px; }
.l-section-head { text-align: center; max-width: 680px; margin: 0 auto 48px; display: grid; gap: 12px; }
.l-section-head h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
.l-section-head p { color: var(--text-3); font-size: 1.05rem; }
.hero { position: relative; overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: -20% -10% auto auto; width: 720px; height: 720px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(165, 139, 255, 0.28), rgba(165, 139, 255, 0)); pointer-events: none;
}
.hero-inner { position: relative; max-width: 1200px; margin: 0 auto; padding: 72px 24px 88px; display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; }
.hero h1 { font-size: clamp(2.3rem, 5vw, 3.7rem); letter-spacing: -0.035em; line-height: 1.05; }
.hero h1 .accent { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-sub { font-size: 1.15rem; color: var(--text-2); margin-top: 20px; max-width: 540px; }
.hero-cta { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 650; color: var(--accent-strong); background: var(--accent-soft); padding: 6px 12px; border-radius: 999px; margin-bottom: 20px; }
.eyebrow svg { width: 15px; height: 15px; }

.preview { position: relative; }
.preview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow-lg); padding: 22px; }
.preview-panel { background: var(--surface-2); border-radius: 18px; padding: 22px; display: grid; justify-items: center; gap: 14px; margin-top: 16px; }
.preview-mic { width: 84px; height: 84px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #fff; box-shadow: 0 12px 28px rgba(111, 79, 242, 0.35); }
.preview-mic svg { width: 34px; height: 34px; }
.preview-bars { display: flex; gap: 4px; height: 36px; align-items: center; }
.preview-bars span { width: 4px; border-radius: 4px; background: var(--accent); opacity: 0.8; }
.preview-transcript { width: 100%; background: var(--surface); border-radius: 14px; padding: 14px 16px; font-size: 0.93rem; display: grid; gap: 8px; }
.preview-tip { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--accent-softer); border: 1px solid var(--accent-soft); font-size: 0.88rem; color: var(--text-2); }
.preview-tip svg { width: 18px; height: 18px; color: var(--accent-strong); flex: none; margin-top: 2px; }

.journey { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; counter-reset: step; }
.journey li { list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px 18px; display: grid; gap: 8px; align-content: start; }
.journey li .num { font-size: 0.78rem; font-weight: 700; color: var(--accent-strong); }
.journey li p { font-size: 0.88rem; color: var(--text-3); }
.journey ol { padding: 0; margin: 0; display: contents; }
.feature { display: grid; gap: 12px; align-content: start; }
.feature p { color: var(--text-3); font-size: 0.95rem; }
.level-card { display: grid; gap: 8px; padding: 20px; }
.level-tag { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cta-band { background: var(--grad); border-radius: 28px; padding: 56px 32px; color: #fff; text-align: center; display: grid; gap: 16px; justify-items: center; box-shadow: var(--shadow-lg); }
.cta-band h2 { color: #fff; font-size: clamp(1.6rem, 3vw, 2.3rem); }
.cta-band p { opacity: 0.92; max-width: 520px; }
.cta-band .btn-primary { background: #fff; color: var(--accent-strong); box-shadow: none; }
.cta-band .btn-primary:hover { background: #f4f0ff; }
.l-footer { border-top: 1px solid var(--border); background: var(--surface); }
.l-footer-inner { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--text-3); font-size: 0.88rem; }

/* ---------- auth / onboarding ---------- */
.auth-wrap { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-side { background: var(--grad); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-side h2 { color: #fff; font-size: 2.2rem; letter-spacing: -0.03em; max-width: 420px; }
.auth-side p { opacity: 0.9; max-width: 420px; margin-top: 12px; }
.auth-side .logo-text strong, .auth-side .logo-text span { color: #fff; }
.auth-side .logo-mark { background: rgba(255, 255, 255, 0.18); box-shadow: none; }
.auth-main { display: grid; place-items: center; padding: 32px 20px; position: relative; }
.auth-card { width: 100%; max-width: 420px; display: grid; gap: 20px; }
.auth-top { position: absolute; top: 20px; right: 20px; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.choice {
  text-align: left; border: 1.5px solid var(--border); background: var(--surface); border-radius: 16px; padding: 16px; cursor: pointer;
  display: grid; gap: 4px; transition: border-color 0.15s, box-shadow 0.15s, background 0.15s; min-height: 64px;
}
.choice:hover { border-color: var(--lilac); }
.choice[aria-pressed="true"], .choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-softer); box-shadow: 0 0 0 4px rgba(121, 90, 246, 0.12); }
.choice strong { font-size: 0.98rem; }
.choice span { font-size: 0.84rem; color: var(--text-3); }
.onb-wrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; background: var(--grad-soft); }
.onb-card { width: 100%; max-width: 760px; }
.steps-bar { display: flex; gap: 6px; }
.steps-bar span { flex: 1; height: 6px; border-radius: 6px; background: var(--border); }
.steps-bar span.on { background: var(--accent); }

/* ---------- dashboard ---------- */
.stat { display: grid; gap: 6px; }
.stat-value { font-size: 1.9rem; font-weight: 750; letter-spacing: -0.03em; line-height: 1.1; }
.stat-label { color: var(--text-3); font-size: 0.88rem; font-weight: 550; }
.stat-top { display: flex; align-items: center; justify-content: space-between; }
.hero-card { background: var(--grad); color: #fff; border: 0; position: relative; overflow: hidden; }
.hero-card h1, .hero-card h2 { color: #fff; }
.hero-card p { color: rgba(255, 255, 255, 0.9); }
.hero-card .btn-primary { background: #fff; color: var(--accent-strong); box-shadow: none; }
.hero-card .btn-primary:hover { background: #f3efff; }
.hero-card .progress-bar { background: rgba(255, 255, 255, 0.25); }
.hero-card .progress-bar > span { background: #fff; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.list { display: grid; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-top: 1px solid var(--border); }
.list-item:first-child { border-top: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .meta { font-size: 0.84rem; color: var(--text-3); }

/* ---------- topics ---------- */
.topic-card { display: flex; flex-direction: column; gap: 14px; }
.topic-card .desc { color: var(--text-3); font-size: 0.93rem; }
.vocab-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 11px; border-radius: 999px; background: var(--surface-2);
  font-size: 0.83rem; color: var(--text-2); border: 1px solid transparent;
}
.chip button { border: 0; background: var(--surface); border-radius: 999px; width: 26px; height: 26px; display: grid; place-items: center; cursor: pointer; color: var(--accent-strong); }
.chip button svg { width: 14px; height: 14px; }
.chip button:disabled { color: var(--success); cursor: default; }
.topic-card .actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- recorder ---------- */
.practice-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.recorder-card { padding: 24px; display: grid; gap: 18px; }
.rec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rec-panel { background: var(--surface-2); border-radius: 20px; padding: 28px 20px 22px; display: grid; justify-items: center; gap: 16px; }
.rec-timer { font-variant-numeric: tabular-nums; font-size: 2.6rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.rec-status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.95rem; color: var(--text-2); min-height: 24px; text-align: center; }
.rec-status.recording { color: var(--danger); }
.rec-status.paused { color: var(--warning); }
.rec-status.stopped { color: var(--success); }
.mic-btn {
  width: 104px; height: 104px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff;
  background: var(--grad); box-shadow: 0 14px 30px rgba(111, 79, 242, 0.35); transition: transform 0.15s var(--ease), box-shadow 0.2s, background 0.2s;
}
.mic-btn svg { width: 40px; height: 40px; }
.mic-btn:hover:not(:disabled) { transform: scale(1.03); }
.mic-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.mic-btn.recording { background: var(--danger); box-shadow: 0 10px 24px rgba(200, 61, 73, 0.35); animation: ring 1.6s ease-out infinite; }
.mic-btn.paused { background: var(--warning); box-shadow: 0 10px 24px rgba(182, 106, 22, 0.3); }
.mic-btn.stopped { background: var(--success); box-shadow: 0 10px 24px rgba(21, 135, 90, 0.3); }
.meter { display: flex; align-items: center; gap: 4px; height: 40px; }
.meter span { width: 5px; border-radius: 4px; background: var(--border-strong); transition: height 0.08s linear, background 0.2s; }
.meter.on span { background: var(--accent); }
.rec-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.transcript-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; min-height: 140px; max-height: 340px; overflow-y: auto; }
.transcript-box p { margin-bottom: 6px; }
.seg-time { font-size: 0.74rem; color: var(--text-3); font-variant-numeric: tabular-nums; margin-right: 8px; font-weight: 600; }
.interim { color: var(--text-3); font-style: italic; }
.selection-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.player { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; }
.player input[type="range"] { flex: 1; accent-color: var(--accent-strong); min-width: 0; height: 28px; }
.player .time { font-variant-numeric: tabular-nums; font-size: 0.84rem; color: var(--text-3); white-space: nowrap; }
.side-panel { position: sticky; top: calc(var(--topbar-h) + 12px); display: grid; gap: 16px; }
.metric-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 0.92rem; }
.metric-row:first-child { border-top: 0; }
.metric-row strong { font-variant-numeric: tabular-nums; }
.fb-item { padding: 12px; border-radius: 12px; background: var(--surface-2); display: grid; gap: 4px; font-size: 0.9rem; }
.fb-item .from { text-decoration: line-through; text-decoration-color: rgba(200, 61, 73, 0.6); color: var(--text-2); }
.fb-item .to { color: var(--success); font-weight: 600; }

/* ---------- report ---------- */
.report { display: grid; gap: 18px; }
.report-section { display: grid; gap: 12px; }
.report-section > h3 { display: flex; align-items: center; gap: 10px; }
.correction { display: grid; gap: 6px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
.correction .pair { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
.correction .pair svg { width: 16px; height: 16px; color: var(--text-3); }
.correction .from { color: var(--danger); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.correction .to { color: var(--success); }
.correction .why { color: var(--text-2); font-size: 0.92rem; }
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.metric-tile { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; }
.metric-tile .v { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.metric-tile .k { font-size: 0.84rem; font-weight: 600; color: var(--text-2); }
.metric-tile .n { font-size: 0.76rem; color: var(--text-3); }
.bullets { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.bullets li::marker { color: var(--accent); }
.text-block { background: var(--surface-2); border-radius: 14px; padding: 14px 16px; white-space: pre-wrap; line-height: 1.65; }
.text-block.corrected { background: var(--success-soft); }
.estimate { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 18px; border-radius: 16px; background: var(--grad-soft); border: 1px solid var(--accent-soft); }
.estimate .big { font-size: 2rem; font-weight: 800; color: var(--accent-strong); letter-spacing: -0.03em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent-strong); }

/* ---------- conversation ---------- */
.chat-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.chat-card { display: flex; flex-direction: column; padding: 0; overflow: hidden; height: calc(100vh - var(--topbar-h) - 140px); height: calc(100dvh - var(--topbar-h) - 140px); min-height: 520px; }
.chat-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chat-scroll { flex: 1; overflow-y: auto; padding: 20px; display: grid; gap: 16px; align-content: start; background: linear-gradient(180deg, #fbfbfe, #f7f8fc); }
.msg { display: grid; gap: 6px; max-width: 82%; }
.msg.user { justify-self: end; }
.msg-bubble { padding: 12px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); white-space: pre-wrap; }
.msg.user .msg-bubble { background: var(--accent-strong); color: #fff; border-color: transparent; border-bottom-right-radius: 6px; }
.msg.assistant .msg-bubble { border-bottom-left-radius: 6px; }
.msg-meta { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-3); flex-wrap: wrap; }
.msg.user .msg-meta { justify-content: flex-end; }
.starters { display: flex; flex-wrap: wrap; gap: 6px; }
.starters button { border: 1px dashed var(--lilac); background: var(--accent-softer); color: var(--accent-strong); padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; cursor: pointer; min-height: 34px; }
.inline-correction { font-size: 0.86rem; padding: 10px 12px; border-radius: 12px; background: var(--warning-soft); display: grid; gap: 4px; }
.composer { border-top: 1px solid var(--border); padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); }
.composer-row { display: flex; gap: 10px; align-items: flex-end; }
.composer textarea { min-height: 46px; max-height: 160px; resize: none; }
.voice-strip { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--danger-soft); }
.voice-strip.paused { background: var(--warning-soft); }
.voice-strip .meter { height: 28px; }
.typing { display: inline-flex; gap: 4px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: pulse 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

/* ---------- vocabulary ---------- */
.flashcard { perspective: 1200px; cursor: pointer; border: 0; background: none; padding: 0; width: 100%; }
.flashcard-inner { position: relative; min-height: 240px; transition: transform 0.5s var(--ease); transform-style: preserve-3d; }
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; padding: 28px;
  display: grid; place-items: center; text-align: center; gap: 10px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow);
}
.flashcard-face.front { background: var(--grad-soft); }
.flashcard-face.front .term { font-size: 1.8rem; font-weight: 750; letter-spacing: -0.02em; }
.flashcard-face.back { transform: rotateY(180deg); }
.vocab-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 16px 0; border-top: 1px solid var(--border); align-items: start; }
.vocab-row:first-child { border-top: 0; }
.vocab-term { font-weight: 700; font-size: 1.02rem; }
.vocab-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--text-3); font-size: 11px; }
.chart .grid line { stroke: var(--border); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.84rem; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.goal-cells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.goal-cell { aspect-ratio: 1; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 0.72rem; color: var(--text-3); font-weight: 600; }
.goal-cell.met { background: var(--success); color: #fff; }
.goal-cell.partial { background: var(--accent-soft); color: var(--accent-strong); }
.goal-cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.chart-tip { position: absolute; pointer-events: none; background: var(--text); color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; white-space: nowrap; transform: translate(-50%, -110%); }

/* ---------- toast & modal ---------- */
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; width: min(92vw, 440px); }
.toast { background: var(--text); color: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: center; animation: fadeUp 0.25s var(--ease); font-size: 0.92rem; }
.toast svg { width: 18px; height: 18px; flex: none; }
.toast.error { background: var(--danger); }
.toast.success svg { color: #7ee2b5; }
.sheet-backdrop { position: fixed; inset: 0; background: rgba(23, 35, 61, 0.35); z-index: 60; animation: fadeUp 0.2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--surface); border-radius: 22px 22px 0 0; padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); display: grid; gap: 4px; box-shadow: var(--shadow-lg); }
.sheet .grabber { width: 40px; height: 5px; border-radius: 4px; background: var(--border-strong); margin: 0 auto 8px; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .practice-grid, .chat-layout { grid-template-columns: minmax(0, 1fr); }
  .side-panel { position: static; }
  .journey { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-inner { grid-template-columns: 1fr; gap: 40px; padding-top: 48px; }
  .l-nav { display: none; }
}
@media (max-width: 900px) {
  :root { --topbar-h: 58px; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar { padding: 0 16px; }
  .topbar .page-title { display: none; }
  .mobile-logo { display: inline-flex; }
  .mobile-logo .logo-text span { display: none; }
  .content { padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); }
  .page-head { margin: 8px 0 18px; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav a, .bottom-nav button {
    display: grid; justify-items: center; gap: 2px; padding: 6px 2px; font-size: 0.68rem; font-weight: 600; color: var(--text-3);
    text-decoration: none !important; border: 0; background: none; cursor: pointer; min-height: 52px; border-radius: 12px;
  }
  .bottom-nav svg { width: 22px; height: 22px; }
  .bottom-nav .active { color: var(--accent-strong); }
  .bottom-nav .speak-tab span.ic { width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px rgba(111, 79, 242, 0.35); }
  .chat-card { height: calc(100dvh - var(--topbar-h) - 120px - env(safe-area-inset-bottom)); min-height: 440px; }
  .card { padding: 18px; border-radius: 16px; }
  .auth-wrap { grid-template-columns: 1fr; }
  .auth-side { display: none; }
  .msg { max-width: 92%; }
  .toasts { bottom: calc(84px + env(safe-area-inset-bottom)); }
  /* recording controls stay within thumb reach */
  .rec-controls .btn { min-height: 48px; }
}
@media (max-width: 640px) {
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .journey { grid-template-columns: minmax(0, 1fr); }
  .l-section { padding: 56px 18px; }
  .l-header-inner { padding: 0 16px; gap: 10px; height: 64px; }
  .l-header-actions .hide-sm { display: none; }
  .logo-text span { font-size: 0.62rem; }
  .hero-inner { padding: 36px 18px 56px; }
  .stat-value { font-size: 1.5rem; }
  .rec-timer { font-size: 2.2rem; }
  .mic-btn { width: 92px; height: 92px; }
  .cta-band { padding: 40px 20px; border-radius: 22px; }
  .vocab-row { grid-template-columns: minmax(0, 1fr); }
  .vocab-actions { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  .mic-btn.recording { animation: none; box-shadow: 0 0 0 6px rgba(200, 61, 73, 0.25); }
}

/* chips with inline icon buttons */
.chip .btn, .chip .chip-speak .btn { width: 26px; height: 26px; min-height: 26px; padding: 0; border-radius: 999px; background: var(--surface); border: 0; }
.chip .btn svg { width: 14px; height: 14px; }
.grow { flex: 1; min-width: 0; }

:root { --font: "Inter", "Segoe UI", "Noto Sans", Roboto, system-ui, -apple-system, sans-serif; }
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex: none; }
.btn .icon { width: 18px; height: 18px; }
.nav-link .icon { width: 19px; height: 19px; }
.bottom-nav .icon { width: 22px; height: 22px; }
.icon-chip .icon { width: 20px; height: 20px; }
.icon-chip.sm .icon { width: 16px; height: 16px; }
.modal-back { position: fixed; inset: 0; background: rgba(23,35,61,.4); z-index: 80; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 720px; }
.dialog { max-width: 440px; }
.hidden { display: none !important; }
.typed-box { display: grid; gap: 8px; width: 100%; }
.page-loading { min-height: 50vh; display: grid; place-items: center; }
</style>

const Store = {

  async saveProfile(p) {
    S.profile = { ...p };

  async saveSession(s) {
    const i = S.sessions.findIndex((x) => x.id === s.id);

  const done = (snap) => {
    if (snap && snap.metadata && snap.metadata.fromCache) return;
    if (--pending <= 0) { clearTimeout(timer); S.dataSlow = false; }
  };
  const onErr = (e) => { clearTimeout(timer); S.ready = true; S.dataSlow = true; console.warn("db", e); render(); };
  db.doc(Store.base()).onSnapshot((snap) => {
    S.profile = snap.exists ? { ...snap.data() } : null;
    if (S.profile && S.profile.lang && S.profile.lang !== S.lang) setLangLocal(S.profile.lang);
    S.ready = true; done(snap); render();
  }, onErr);
  db.doc(Store.base()).collection("sessions").orderBy("startedAt", "desc").limit(300).onSnapshot((snap) => {
    S.sessions = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    done(snap); if (S.ready) renderQuiet();
  }, onErr);
  db.doc(Store.base()).collection("vocab").orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => {
    S.vocab = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    done(snap); if (S.ready) renderQuiet();
  }, onErr);
}

// Avoid re-rendering while the learner is typing or speaking.
function renderQuiet() {
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.tagName === "SELECT")) return;
  if (Speech.busy()) return;
  render();
}

// ============================================================
// AI (Claude via the sample capability)
// ============================================================
async function askJSON(prompt, tier = "default") {
  if (!S.caps.sample) throw { code: "ai_not_configured" };
  let res;
  try { res = await S.caps.sample(prompt, { cache: false, modelTier: tier }); }
  catch (e) { throw { code: e && e.code === "rate_limited" ? "rate_limited" : e && e.code === "not_granted" ? "ai_not_configured" : "ai_unavailable" }; }
  const text = (res && res.text) || "";
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b < a) throw { code: "ai_unavailable" };
  try { return JSON.parse(text.slice(a, b + 1)); } catch { throw { code: "ai_unavailable" }; }
}

const LEVEL_GUIDE = {
  A1: "A1 beginner: very short simple sentences, present simple, everyday words. Ask yes/no or very simple wh- questions.",
  A2: "A2 elementary: short sentences, common past and future forms, familiar topics. Simple open questions.",
  B1: "B1 intermediate: natural everyday English; ask for reasons and simple opinions.",
  B2: "B2 upper-intermediate: natural English with some idioms; ask for opinions, comparisons and justification.",
  C1: "C1 advanced: sophisticated idiomatic English; demanding follow-ups needing nuance and hypotheticals.",
  C2: "C2 proficient: speak as to an educated native speaker; challenge assumptions, ask for counter-arguments.",
};

function partnerSystem(level, topic) {
  const corr = S.profile.corrections === "during";
  return [
    "You are the AI speaking partner in Speak Up, an English speaking practice platform.",
    "Learner level: " + LEVEL_GUIDE[level],
    S.profile.name ? "The learner's name is " + S.profile.name + "." : "",
    topic ? `Topic: "${topic.title.en}" — ${topic.description.en}` : "Topic: free conversation about everyday life.",
    topic && topic.roleplay ? `ROLE PLAY: you are ${topic.roleplay.aiRole}; the learner is ${topic.roleplay.learnerRole}. Scenario: ${topic.roleplay.scenario} Stay in character and react to what the learner actually says.` : "",
    topic && topic.ielts ? `IELTS Speaking Part ${topic.ielts.part} style: behave like a calm examiner, one question at a time, no band scores.` : "",
    "Rules: always reply in English. React meaningfully to what the learner just said, then ask exactly ONE clear question. Keep replies short (1–3 sentences for A1–B1, up to 4 for B2–C2). Stay on topic. The learner's text may come from speech recognition: ignore punctuation and obvious recognition slips. Never claim to be human.",
    lvlIdx(level) <= 1 ? "Give 2–3 short English sentence starters that help answer your question." : "Give sentence starters only if the learner seems stuck; otherwise an empty list.",
    corr ? `Corrections ON: if the learner's LAST message has a clear grammar or word-choice error, give ONE correction; its explanation in ${LANG_PROMPT[S.lang]}, the phrases in English. Otherwise null.` : "Corrections OFF: correction must be null.",
    'Answer with ONLY a JSON object: {"reply": string, "starters": string[], "correction": {"original": string, "corrected": string, "explanation": string} | null}',
  ].filter(Boolean).join("\n");
}

async function partnerTurn(conv) {
  const topic = topicById(conv.topicId);
  const msgs = [{ role: "user", content: partnerSystem(conv.level, topic) + "\n\n[The learner opened the session. Greet them briefly and ask your first question.]" }];
  for (const m of conv.messages) {
    const last = msgs[msgs.length - 1];
    const content = m.role === "assistant" ? JSON.stringify({ reply: m.content }) : m.content;
    if (last.role === m.role) last.content += "\n" + content; else msgs.push({ role: m.role, content });
  }
  if (msgs[msgs.length - 1].role !== "user") msgs.push({ role: "user", content: "(continue)" });
  const out = await askJSON(msgs, "default");
  return {
    reply: String(out.reply || "").trim() || "…",
    starters: Array.isArray(out.starters) ? out.starters.slice(0, 3).map(String) : [],
    correction: S.profile.corrections === "during" && out.correction && out.correction.original ? out.correction : null,
  };
}

async function buildReport({ kind, text, metrics, level, topicId, taskId, edited }) {
  const topic = topicById(topicId), task = taskById(taskId);
  const ctx = kind === "assessment" ? "Speaking assessment task: " + (task ? task.prompt : "free speaking")
    : kind === "conversation" ? "Learner turns from an AI conversation" + (topic ? ` on "${topic.title.en}"` : "")
    : "Speaking recorder practice" + (topic ? ` on "${topic.title.en}"` : "");
  const L = LANG_PROMPT[S.lang];
  const prompt = [
    "You are an experienced, encouraging English speaking coach writing feedback for Speak Up.",
    `Learner's selected level: ${level}. Context: ${ctx}.`,
    `Measured: recording ${Math.round(metrics.durationSec)} s (manual pauses excluded), ${metrics.wordCount} words, pace ${metrics.wpm ?? "n/a"} words/min, long pauses ${metrics.longPauses.length}, hesitation sounds ${metrics.hesitations.length}.`,
    `Write every explanation, strength, improvement, recommendation and the summary in ${L}. Keep English phrases (original, corrected, suggestions, examples, corrected_version) in English.`,
    "Base every finding on the text. Quote the learner's exact phrase as `original`. Do not invent errors. The text comes from speech recognition: ignore punctuation/capitalisation and likely recognition slips. Never comment on pronunciation.",
    "grammar: up to 8 real errors, most important first, each with `at` (seconds) when a [mm:ss] mark is visible, else null. vocabulary: up to 5 more natural/level-appropriate suggestions with an English example. contextual_fillers: only 'like', 'you know', 'I mean', 'basically', 'actually', 'so', 'well', 'kind of' used AS FILLERS in context ('I like pizza' is not). corrected_version: the whole text rewritten correctly at about their level. strengths and improvements: 2–4 each. recommendations: 3 specific, achievable next steps.",
    kind === "assessment" ? `Give a PRACTICE ESTIMATE cefr_estimate (A1–C2)${task && task.ielts ? " and ielts_band_estimate (0–9 in 0.5 steps)" : " and ielts_band_estimate null"} with a one-sentence estimate_rationale. Use null if the sample is too short.` : "cefr_estimate, ielts_band_estimate and estimate_rationale must be null.",
    'Answer with ONLY a JSON object: {"summary":string,"corrected_version":string,"grammar":[{"original":string,"corrected":string,"explanation":string,"at":number|null}],"vocabulary":[{"original":string,"suggestion":string,"explanation":string,"example":string}],"contextual_fillers":[{"phrase":string,"at":number|null,"explanation":string}],"strengths":string[],"improvements":string[],"recommendations":string[],"cefr_estimate":string|null,"ielts_band_estimate":number|null,"estimate_rationale":string|null}',
    "",
    "Learner's speech" + (edited ? " (edited by the learner after recognition)" : "") + ":",
    text,
  ].join("\n");
  const ai = await askJSON(prompt, "default");
  const arr = (x) => (Array.isArray(x) ? x : []);
  return {
    summary: String(ai.summary || ""), corrected_version: String(ai.corrected_version || ""),
    grammar: arr(ai.grammar), vocabulary: arr(ai.vocabulary), contextual_fillers: arr(ai.contextual_fillers),
    strengths: arr(ai.strengths), improvements: arr(ai.improvements), recommendations: arr(ai.recommendations),
    cefr_estimate: kind === "assessment" ? ai.cefr_estimate || null : null,
    ielts_band_estimate: kind === "assessment" && task && task.ielts && typeof ai.ielts_band_estimate === "number" ? ai.ielts_band_estimate : null,
    estimate_rationale: kind === "assessment" ? ai.estimate_rationale || null : null,
  };
}

async function liveTip(text, level) {
  const out = await askJSON([
    `Give very short live feedback on one spoken utterance of an English learner (speech-recognition output). Level ${level}. Explanations in ${LANG_PROMPT[S.lang]}; English phrases stay English. At most 2 items (most useful grammar fix and/or more natural word); empty list if fine or too short. Ignore punctuation and likely recognition slips. Treat 'like'/'you know' as fillers only when they are fillers in context.`,
    'Answer with ONLY JSON: {"items":[{"type":"grammar"|"vocabulary"|"filler","original":string,"suggestion":string,"explanation":string}]}',
    "Utterance: " + text,
  ].join("\n"), "quick");
  return Array.isArray(out.items) ? out.items.slice(0, 2) : [];
}

async function defineTerm(term, context) {
  const out = await askJSON(`You help English learners. Give a short meaning (max 15 words) of the English word or phrase in ${LANG_PROMPT[S.lang]}, and one natural English example sentence.${context ? " Use the meaning in this context: " + context : ""}\nWord or phrase: ${term}\nAnswer with ONLY JSON: {"meaning": string, "example": string}`, "quick");
  return { meaning: String(out.meaning || ""), example: String(out.example || "") };
}

// ============================================================
// Shared speech engine (dictation capability)
// Used by the Speaking Recorder, AI Conversation and Assessment.
// States: idle → listening ⇄ paused → stopping → stopped
// Pause stops recognition (nothing is captured while paused);
// the active clock excludes paused time. Each take has a
// generation number; events from a deleted take are ignored.
// ============================================================
const Speech = {
  gen: 0, owner: null, state: "idle", segments: [], partial: "", activeMs: 0, runStart: 0,
  lastEventSec: 0, pauses: [], error: null, notice: null, timer: null, startedAt: 0, wired: false,
  busy() { return this.state === "listening" || this.state === "stopping" || this.state === "pausing"; },
  active() { return ["listening", "paused", "stopping", "pausing"].includes(this.state); },
  sec() { return (this.activeMs + (this.state === "listening" ? performance.now() - this.runStart : 0)) / 1000; },
  wire() {
    const d = S.caps.dictation;
    if (!d || this.wired) return;
    this.wired = true;
    d.onPartial(({ text }) => {
      if (this.state !== "listening") return;
      this.mark(); this.partial = text || ""; updateLive();
    });
    d.onFinal(({ text }) => {
      if (!["listening", "pausing", "stopping"].includes(this.state)) return;
      const clean = (text || "").trim();
      this.partial = "";
      if (clean) {
        const at = this.sec();
        const prev = this.segments[this.segments.length - 1];
        if (!(prev && prev.text === clean && at - prev.at < 0.5)) this.segments.push({ id: this.gen + "-" + this.segments.length, text: clean, at, start: Math.max(0, at - words(clean).length * 0.4) });
        this.mark();
      }
      updateLive();
    });
    d.onState(({ state, reason }) => {
      if (state === "idle" && this.state === "listening") {
        // Recognition ended without the learner pressing Pause/Stop (e.g. the page was hidden).
        this.activeMs += performance.now() - this.runStart;
        this.state = "paused";
        this.notice = reason === "hidden" ? "backgrounded" : "interrupted";
        this.partial = "";
        render();
      }
    });
  },
  mark() {
    const now = this.sec();
    if (this.lastEventSec && now - this.lastEventSec >= 2.5 && this.segments.length) this.pauses.push({ at: this.lastEventSec, length: now - this.lastEventSec });
    this.lastEventSec = now;
  },
  start(owner) {
    const d = S.caps.dictation;
    if (!d || this.active()) return false;
    Voice.stop();                 // the AI voice must never be captured as learner speech
    this.reset(false);
    this.owner = owner; this.startedAt = Date.now();
    this.wire();
    const p = d.start();          // called straight from the click: nothing awaited before it
    this.state = "listening"; this.runStart = performance.now();
    this.tick();
    p.catch((e) => this.fail(e));
    render();
    return true;
  },
  fail(e) {
    if (this.state === "idle") return;
    this.state = "idle"; clearInterval(this.timer);
    this.error = e && e.code === "not_granted" ? "permission_denied" : e && e.code === "dismissed" ? "dismissed" : "unknown";
    if (e && e.code === "not_granted") S.caps.dictation = null;
    render();
  },
  tick() { clearInterval(this.timer); this.timer = setInterval(() => { const el = document.querySelector("[data-timer]"); if (el) el.textContent = fmt(this.sec()); this.autoLimit(); }, 250); },
  limit: null,
  autoLimit() { if (this.limit && this.state === "listening" && this.sec() >= this.limit) this.stop(); },
  async pause() {
    if (this.state !== "listening") return;
    this.activeMs += performance.now() - this.runStart;
    this.state = "pausing"; render();
    const g = this.gen;
    try { await S.caps.dictation.stop(); } catch {}
    if (g !== this.gen) return;
    this.state = "paused"; this.partial = ""; render();
  },
  resume() {
    if (this.state !== "paused") return;
    Voice.stop();
    const p = S.caps.dictation.start();
    this.state = "listening"; this.runStart = performance.now(); this.notice = null;
    p.catch((e) => this.fail(e));
    render();
  },
  async stop() {
    if (this.state !== "listening" && this.state !== "paused") return;
    const g = this.gen;
    if (this.state === "listening") this.activeMs += performance.now() - this.runStart;
    this.state = "stopping"; render();
    try { await S.caps.dictation.stop(); } catch {}
    if (g !== this.gen) return;
    clearInterval(this.timer);
    this.state = "stopped"; this.partial = "";
    onTakeStopped(this.owner, g);
    render();
  },
  reset(doRender = true) {
    this.gen++;
    if (this.state === "listening" || this.state === "pausing" || this.state === "stopping") { try { S.caps.dictation && S.caps.dictation.stop(); } catch {} }
    clearInterval(this.timer);
    Object.assign(this, { owner: null, state: "idle", segments: [], partial: "", activeMs: 0, lastEventSec: 0, pauses: [], error: null, notice: null, limit: null });
    if (doRender) render();
  },
  text() { return this.segments.map((s) => s.text).join(" "); },
};

// ---------- metrics (from recognised words and the active clock) ----------
const HES = /^(u+m+|u+h+|e+r+m*|h+m+|a+h+|m+h*m+)$/i;
const ALLOWED_DOUBLES = new Set(["had", "that", "very", "bye", "no", "yes", "so", "well", "really"]);
const normW = (w) => w.toLowerCase().replace(/[^\p{L}\p{N}']+/gu, "");
function computeMetrics(text, durationSec, pauses) {
  const ws = words(text);
  const hesitations = ws.filter((w) => HES.test(normW(w))).map((w) => ({ word: normW(w) }));
  const content = ws.filter((w) => normW(w) && !HES.test(normW(w)));
  const n = content.map(normW);
  const repeats = [];
  for (let i = 1; i < n.length; i++) {
    if (n[i] === n[i - 1] && !ALLOWED_DOUBLES.has(n[i])) repeats.push({ phrase: content[i - 1] + " " + content[i] });
    else if (i >= 3 && n[i] === n[i - 2] && n[i - 1] === n[i - 3] && n[i] !== n[i - 1]) repeats.push({ phrase: content.slice(i - 3, i + 1).join(" ") });
  }
  return {
    durationSec: Math.round(durationSec * 10) / 10,
    wordCount: content.length,
    wpm: durationSec >= 10 && content.length ? Math.round(content.length / (durationSec / 60)) : null,
    longPauses: (pauses || []).map((p) => ({ at: Math.round(p.at * 10) / 10, length: Math.round(p.length * 10) / 10 })),
    repeats, hesitations,
  };
}

// ============================================================
// Take completion (recorder & assessment)
// ============================================================
async function onTakeStopped(owner, gen) {
  if (owner === "recorder" || owner === "assessment") {
    const st = owner === "recorder" ? S.rec : S.assess;
    st.phase = "saving"; st.report = null; st.error = null; st.edited = null;
    const text = Speech.text();
    const dur = Speech.sec();
    const metrics = computeMetrics(text, dur, Speech.pauses);
    const session = {
      id: uid(), kind: owner, topicId: owner === "recorder" ? st.topicId || null : null, taskId: owner === "assessment" ? st.taskId : null,
      level: S.profile.level, startedAt: Speech.startedAt, durationSec: dur, wordCount: metrics.wordCount,
      transcript: text, segments: Speech.segments.map((s) => ({ text: s.text, at: Math.round(s.at * 10) / 10 })), edited: null, metrics, report: null, reportStatus: "none", status: "completed",
    };
    try { await Store.saveSession(session); } catch (e) { console.warn(e); }
    if (gen !== Speech.gen) { Store.deleteSession(session.id).catch(() => {}); return; }
    st.sessionId = session.id;
    if (!text && dur < 0.5) { st.phase = "idle"; Speech.error = "empty"; render(); return; }
    await analyse(st, session.id, gen);
  }
}
async function analyse(st, sessionId, gen) {
  const session = S.sessions.find((x) => x.id === sessionId);
  if (!session) return;
  const textUsed = session.edited || (session.segments || []).map((s) => `[${fmt(Math.max(0, s.at - words(s.text).length * 0.4))}] ${s.text}`).join("\n");
  const wc = words(session.edited || session.transcript).filter((w) => !HES.test(normW(w))).length;
  if (wc < 20) {
    session.reportStatus = "insufficient"; session.report = { insufficient: true, wordCount: wc };
    await Store.saveSession(session).catch(() => {});
    if (gen !== Speech.gen) return;
    st.phase = "ready"; render(); return;
  }
  st.phase = "analyzing"; render();
  try {
    const ai = await buildReport({ kind: session.kind, text: textUsed, metrics: session.metrics, level: session.level, topicId: session.topicId, taskId: session.taskId, edited: !!session.edited });
    if (gen !== Speech.gen) return;  // deleted while analysing
    session.report = { ai, edited: !!session.edited, generatedAt: Date.now() };
    session.reportStatus = "ready";
    session.estimate = ai.cefr_estimate || ai.ielts_band_estimate != null ? { cefr: ai.cefr_estimate, ielts: ai.ielts_band_estimate } : null;
    await Store.saveSession(session).catch(() => {});
    st.phase = "ready";
  } catch (e) {
    if (gen !== Speech.gen) return;
    session.reportStatus = "failed"; Store.saveSession(session).catch(() => {});
    st.phase = "failed"; st.error = e.code || "ai_unavailable";
  }
  render();
}

// ---------- stats ----------
function stats(days = 14) {
  const tz = S.profile.tz || "UTC";
  const today = localDate(Date.now(), tz);
  const minutes = {}, sess = {}, practised = new Set();
  for (const s of S.sessions) {
    const d = localDate(s.startedAt, tz);
    minutes[d] = (minutes[d] || 0) + (s.durationSec || 0) / 60;
    if (s.status === "completed") sess[d] = (sess[d] || 0) + 1;
    practised.add(d);
  }
  let streak = 0, cur = practised.has(today) ? today : dayShift(today, -1);
  while (practised.has(cur)) { streak++; cur = dayShift(cur, -1); }
  const list = Array.from({ length: days }, (_, i) => dayShift(today, i - days + 1));
  const target = S.profile.target || 10;
  const vdates = S.vocab.map((v) => localDate(v.createdAt, tz));
  return {
    today, tz, target, streak,
    todayMin: minutes[today] || 0,
    totalMin: S.sessions.reduce((a, s) => a + (s.durationSec || 0), 0) / 60,
    completed: S.sessions.filter((s) => s.status === "completed").length,
    daily: list.map((d) => ({ date: d, minutes: Math.round((minutes[d] || 0) * 10) / 10, sessions: sess[d] || 0, goalMet: (minutes[d] || 0) >= target })),
    vocabSeries: list.map((d) => ({ date: d, total: vdates.filter((x) => x <= d).length })),
  };
}
const fmtMin = (m) => (m >= 10 ? String(Math.round(m)) : String(Math.round(m * 10) / 10));
const sessionTitle = (s) => (topicById(s.topicId) ? topicById(s.topicId).title[S.lang] : taskById(s.taskId) ? taskById(s.taskId).title[S.lang] : t("dash.freeTopic"));

  const icn = s.kind === "conversation" ? "chat" : s.kind === "assessment" ? "clip" : "mic";
  return `<a href="#session-${esc(s.id)}" class="list-item" style="color:inherit;text-decoration:none"><span class="icon-chip sm">${ic(icn)}</span><div class="grow"><div class="title">${esc(sessionTitle(s))}</div><div class="meta">${esc(t("kind." + s.kind))} · ${esc(s.level)} · ${esc(fmtDate(s.startedAt))} · ${fmt(s.durationSec || 0)}${s.estimate && s.estimate.cefr ? " · " + esc(s.estimate.cefr) : ""}</div></div>${badge}</a>`;

function transcriptPanel(owner) {
  const st = owner === "recorder" ? S.rec : S.assess;

  const stopped = Speech.state === "stopped";
  const corrected = session && session.report && session.report.ai ? session.report.ai.corrected_version : null;
  const view = st.view || "original";
  const tabs = stopped && session && (session.edited || corrected) ? `<div class="seg" role="tablist"><button type="button" aria-pressed="${view === "original"}" data-view="original">${esc(t("rec.recognised"))}</button>${session.edited ? `<button type="button" aria-pressed="${view === "edited"}" data-view="edited">${esc(t("rec.edited"))}</button>` : ""}${corrected ? `<button type="button" aria-pressed="${view === "corrected"}" data-view="corrected">${esc(t("rec.corrected"))}</button>` : ""}</div>` : "";
  let body;

    body = `<p class="hint">${esc(t("rec.editHint"))}</p><textarea class="textarea" id="edit-text" lang="en" rows="6">${esc(session.edited || session.transcript)}</textarea><div class="row"><button class="btn btn-primary btn-sm" data-act="edit-save" data-owner="${owner}">${esc(t("rec.saveEdit"))}</button><button class="btn btn-ghost btn-sm" data-act="edit-cancel" data-owner="${owner}">${esc(t("common.cancel"))}</button></div>`;
  } else if (view === "edited" && session && session.edited) body = `<div class="transcript-box" lang="en"><p>${esc(session.edited)}</p></div>`;
  else if (view === "corrected" && corrected) body = `<div class="transcript-box" lang="en"><p style="color:var(--success)">${esc(corrected)}</p></div>`;
  else body = `<div class="transcript-box" lang="en" aria-live="polite" data-live-box>${liveTranscriptHtml()}</div>`;
  return `<div class="stack-sm"><div class="row-between"><h3>${esc(t("rec.transcript"))}</h3>${stopped && session && session.transcript && !st.editing ? `<button class="btn btn-ghost btn-sm" data-act="edit-open" data-owner="${owner}">${ic("edit")} ${esc(t("rec.editTranscript"))}</button>` : ""}</div>${tabs}${body}
    ${stopped ? `<div class="selection-bar" data-selbar></div>` : ""}</div>`;
}
function liveTranscriptHtml() {
  if (!Speech.segments.length && !Speech.partial) return `<p class="muted">${esc(Speech.state === "stopped" ? t("rec.noSpeech") : Speech.state === "listening" ? t("web.speakNow") : t("rec.transcriptEmpty"))}</p>`;
  return Speech.segments.map((s) => `<p><span class="seg-time">${fmt(s.start)}</span>${esc(s.text)}</p>`).join("") + (Speech.partial ? `<p class="interim">${esc(Speech.partial)} <span class="small">(${esc(t("rec.listening"))})</span></p>` : "");
}
// live updates without re-rendering the whole page
let meterPhase = 0, lastActivity = 0;
function updateLive() {
  lastActivity = performance.now();
  const box = document.querySelector("[data-live-box]");
  if (box) { box.innerHTML = liveTranscriptHtml(); box.scrollTop = box.scrollHeight; }
  const strip = document.querySelector("[data-voice-text]");
  if (strip) strip.textContent = [Speech.text(), Speech.partial].filter(Boolean).join(" ") || t("conv.recordingNow");
  updateLiveFeedback();
}
setInterval(() => {
  const m = document.querySelector("[data-meter]");
  if (!m) return;
  // Recognition activity (not raw audio level): bars move while words are arriving.
  const activeNow = performance.now() - lastActivity < 700;
  meterPhase += 0.6;
  m.querySelectorAll("span").forEach((b, i) => { b.style.height = (activeNow ? 8 + Math.abs(Math.sin(meterPhase + i * 0.7)) * 26 : 6) + "px"; });
}, 120);

// live feedback panel
const LIVE = { gen: -1, sent: 0, items: [], last: 0, off: false, timer: null };
function liveFeedbackCard() {
  const m = computeMetrics(Speech.text(), Speech.sec(), Speech.pauses);
  const items = LIVE.gen === Speech.gen ? LIVE.items : [];
  return `<div class="card card-tight stack-sm" data-live-fb><h3 class="row">${ic("bulb")} ${esc(t("live.title"))}</h3>
    <div><div class="metric-row"><span>${esc(t("live.pace"))}</span><strong>${m.wpm != null ? esc(t("live.wpm", { n: m.wpm })) : "—"}</strong></div>
    <div class="metric-row"><span>${esc(t("live.longPauses"))}</span><strong>${m.longPauses.length}</strong></div>
    <div class="metric-row"><span>${esc(t("live.hesitations"))}</span><strong>${m.hesitations.length}</strong></div></div>
    ${!S.caps.sample || LIVE.off ? `<p class="small muted">${esc(t("live.aiOff"))}</p>` : items.length ? items.map((i) => `<div class="fb-item"><span class="badge badge-outline" style="justify-self:start">${esc(t("live.type." + i.type))}</span><span lang="en"><span class="from">${esc(i.original)}</span> → <span class="to">${esc(i.suggestion)}</span></span><span class="small muted">${esc(i.explanation)}</span></div>`).join("") : `<p class="small muted">${esc(Speech.segments.length ? t("live.none") : t("live.waiting"))}</p>`}
  </div>`;
}
function updateLiveFeedback() {
  if (LIVE.gen !== Speech.gen) { LIVE.gen = Speech.gen; LIVE.sent = 0; LIVE.items = []; LIVE.off = false; }
  const el = document.querySelector("[data-live-fb]");
  if (el) el.outerHTML = liveFeedbackCard();
  if (!S.caps.sample || LIVE.off || Speech.owner === "conversation") return;
  const pending = Speech.segments.slice(LIVE.sent);
  const txt = pending.map((s) => s.text).join(" ");
  if (words(txt).length < 6 || LIVE.timer) return;
  const wait = Math.max(0, 10000 - (Date.now() - LIVE.last));
  const g = Speech.gen;
  LIVE.timer = setTimeout(async () => {
    LIVE.timer = null;
    const upto = Speech.segments.length;
    const text = Speech.segments.slice(LIVE.sent, upto).map((s) => s.text).join(" ");
    LIVE.sent = upto; LIVE.last = Date.now();
    try {
      const items = await liveTip(text, S.profile.level);
      if (g !== Speech.gen) return;
      LIVE.items = [...items, ...LIVE.items].slice(0, 4);
    } catch (e) { if (g === Speech.gen) LIVE.off = true; }
    const el2 = document.querySelector("[data-live-fb]"); if (el2) el2.outerHTML = liveFeedbackCard();
  }, wait);
}
